# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [governance]
# tags: [L9_TEMPLATE, pr-review, coderabbit]
# owner: platform
# status: active
# --- /L9_META ---
#
# CodeRabbit — paid tier: install the GitHub App + enable repo in dashboard.
# This file tunes review behavior; see https://docs.coderabbit.ai/reference/configuration
# Delta context: CODERABBIT.md
#
# inheritance: true merges this file with the Quantum-L9 organization review
# policy: a value set here wins, a value left out is inherited, and lists are
# this file's entries followed by the organization's
# (https://docs.coderabbit.ai/configuration/configuration-inheritance).
# Review profile, approval / request-changes behaviour and summary placement
# come from the organization policy and are not set here. Only EIE-specific
# settings belong in this file.

inheritance: true

language: en-US
early_access: false

reviews:
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    labels:
      - "!do-not-review"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  path_filters:
    - "!readme/**"
    - "!reports/**"
    - "!htmlcov/**"
    - "!**/.cursor/**"

  instructions: |
    This repo follows the L9 Constellation architecture. Check ALL code against
    these rules (violations are CRITICAL):

    1. No eval(), exec(), pickle.loads() anywhere
    2. No f-string interpolation in Cypher or SQL - use parameterized queries
    3. No FastAPI imports in engine/ - chassis owns HTTP
    4. No raw HTTP calls between nodes - use delegate_to_node()
    5. No direct writes to packetstore - use ingest_packet()
    6. No redefining TransportPacket or SDK transport types — import from constellation_node_sdk (not ad-hoc copies)
    7. No configuring structlog or logging.basicConfig in engine/ - chassis does it
    8. No bare except: clauses
    9. No NotImplementedError stubs
    10. All packet_type values must be lowercase snake_case from the registry

    Contract files are in docs/contracts/. Reference them in your review.

chat:
  auto_reply: true
