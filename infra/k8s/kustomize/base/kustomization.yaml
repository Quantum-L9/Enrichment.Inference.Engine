apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enrichment

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - rbac.yaml
  - network-policy.yaml
  - redis.yaml

configMapGenerator:
  - name: enrichment-config
    literals:
      - REDIS_URL=redis://redis:6379/0
      - KB_DIR=/app/kb
      - LOG_LEVEL=INFO
      - PERPLEXITY_MODEL=sonar-reasoning
      - DEFAULT_CONSENSUS_THRESHOLD=0.65
      - DEFAULT_MAX_VARIATIONS=5
      - DEFAULT_TIMEOUT_SECONDS=120
      - MAX_CONCURRENT_VARIATIONS=3
      - CB_FAILURE_THRESHOLD=5
      - CB_COOLDOWN_SECONDS=60
      # Gate routing: without registration Gate has no `converge` route for
      # this worker. GATE_ADMIN_TOKEN comes from the enrichment-credentials
      # secret (deployment.yaml), never from this ConfigMap.
      - GATE_URL=http://constellation-gate.gate.svc.cluster.local:9000
      - GATE_REGISTRATION_ENABLED=true
      - GATE_INTERNAL_URL=http://enrichment-api.enrichment.svc.cluster.local:8000
      - GATE_REREGISTRATION_INTERVAL_SECONDS=60
