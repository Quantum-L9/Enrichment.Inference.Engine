apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enrichment

resources:
  - ../../base

# Replica count is fixed at 1 in ../../base (EIE-212-F001); no overlay may raise it.
patches:
  - target:
      kind: Deployment
      name: enrichment-api
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values: ["enrichment-api"]
                  topologyKey: kubernetes.io/hostname

configMapGenerator:
  - name: enrichment-config
    behavior: merge
    literals:
      - LOG_LEVEL=WARNING
      - DEFAULT_MAX_VARIATIONS=5
      - MAX_CONCURRENT_VARIATIONS=3

images:
  - name: ghcr.io/OWNER/domain-enrichment-api
    newTag: v2.2.0
