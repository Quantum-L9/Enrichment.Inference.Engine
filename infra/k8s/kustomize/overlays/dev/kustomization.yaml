apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enrichment-dev

resources:
  - ../../base

# Replica count and the absence of an HPA are fixed in ../../base (EIE-212-F001);
# no overlay may raise them.
configMapGenerator:
  - name: enrichment-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - DEFAULT_MAX_VARIATIONS=2
      - MAX_CONCURRENT_VARIATIONS=2

images:
  - name: ghcr.io/OWNER/domain-enrichment-api
    newTag: dev-latest
