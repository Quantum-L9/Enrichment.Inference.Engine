apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enrichment-staging

resources:
  - ../../base

# Replica count is fixed at 1 in ../../base (EIE-212-F001); no overlay may raise it.
configMapGenerator:
  - name: enrichment-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO

images:
  - name: ghcr.io/OWNER/domain-enrichment-api
    newTag: rc-latest
