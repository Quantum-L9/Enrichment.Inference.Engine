# EIE-212-F001: one replica in every environment (see values.yaml).
replicaCount: 1

image:
  tag: "rc-latest"

ingress:
  enabled: true
  hosts:
    - host: enrichment-staging.example.com
      paths:
        - path: /api
          pathType: Prefix

config:
  LOG_LEVEL: "INFO"
  L9_ENVIRONMENT: "staging"
  L9_SIGNING_KEY_ID: "enrichment-engine-staging"

pdb:
  enabled: true
  minAvailable: 1
