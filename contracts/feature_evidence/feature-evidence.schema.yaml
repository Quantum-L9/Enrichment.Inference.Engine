$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:l9:plasticos:contracts:payload:feature-evidence:1.0.0-draft
title: PlasticOS FeatureEvidence
description: EIE-emitted value-bearing evidence. Not a transport envelope.
x-publication-status: draft-unpublished
type: object
additionalProperties: false
required:
- contract_version
- domain
- feature_id
- subject_ref
- value
- value_state
- confidence
- source
- method
- observed_at
- provenance
- execution_version
properties:
  contract_version:
    type: string
    const: 1.0.0-draft
  domain:
    type: string
    const: plasticos
  feature_id:
    type: string
    pattern: ^[a-z][a-z0-9_.-]{1,127}$
  subject_ref:
    type: string
    pattern: ^[a-z0-9_.-]+:[^\s]+$
  value:
    type: object
    additionalProperties: false
    required: [kind, value]
    properties:
      kind:
        type: string
        enum: [string, number, boolean, string_list, null]
      value: {}
  unit:
    type: [string, 'null']
  value_state:
    type: string
    enum: [observed, reported, inferred, unknown, not_applicable, stale, conflicting, superseded]
  confidence:
    type: number
    minimum: 0
    maximum: 1
  source:
    type: string
    enum: [crm, enrichment, inference, manual, seed, graph, external]
  method:
    type: string
    minLength: 1
  observed_at:
    type: string
    format: date-time
  valid_until:
    type: [string, 'null']
    format: date-time
  provenance:
    type: object
    additionalProperties: false
    required: [source_type, source_ref, method]
    properties:
      source_type:
        type: string
        enum: [odoo, enrichment, inference, manual, seed, graph, external]
      source_ref:
        type: string
        minLength: 1
      method:
        type: string
        minLength: 1
      actor_ref:
        type: [string, 'null']
      rule_or_model_version:
        type: [string, 'null']
      content_hash:
        type: [string, 'null']
  evidence_ref:
    type: [string, 'null']
  supersedes_ref:
    type: [string, 'null']
  conflicts_with_refs:
    type: array
    items:
      type: string
    uniqueItems: true
  execution_version:
    type: string
    minLength: 1
