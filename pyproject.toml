[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-enrichment-api"
license = { text = "Proprietary" }
version = "2.3.0"
description = "Universal domain-aware entity enrichment API — Salesforce + Odoo single ingress"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "asyncpg",
    # Gate_SDK owns release identity; the consumer contract is its moving
    # major channel `v1`, not a commit sha (contracts/RELEASE_IDENTITY_LEDGER
    # .json, schema v2). Gate and CEG declare the same channel. The source is
    # [tool.uv.sources] below; uv.lock records the commit the channel resolved
    # to, and `python scripts/validate_sdk_pin.py --verify-tag` proves it is
    # current. EIE-001 is what that split looks like when it goes unchecked:
    # pyproject named 69c6c67 while the lock carried 2b2f53a2, and the two
    # differ by the GateClientConfig fix that loads L9_VERIFYING_KEYS_JSON.
    "constellation-node-sdk",
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    # app/services/pg_store.py imports sqlalchemy.ext.asyncio, which needs
    # greenlet; SQLAlchemy 2.1 only pulls greenlet through the `asyncio` extra.
    "sqlalchemy[asyncio]",
    # `alembic upgrade head` (migrations/, alembic.ini) is the schema step run
    # by scripts/docker-entrypoint.sh; without it no table exists.
    "alembic>=1.13",
    "structlog>=24.0.0",
    "perplexityai>=0.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

# One lock (uv.lock) resolves the project and every group together; install
# profiles select groups (tools/deps/install_locked.sh). Core-owned tools (pip,
# pre-commit, ruff, mypy, pytest, semgrep) are declared nowhere here: they are
# excluded from the lock ([tool.uv] below) and installed from
# Quantum-L9/l9-ci-core's installer pins, so a Core bump needs no edit in this
# repository (tests/unit/test_core_toolchain_pins.py).
[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "pytest-cov==7.1.0",
    "respx>=0.22",
    "coverage==7.17.1",
    "jsonschema>=4.23.0",
]
# CI-only tools the workflows run beyond the dev set.
ci = [
    # No types-redis: redis>=5 ships its own inline types (py.typed). The
    # typeshed stubs stop at redis 4 and shadow them (e.g. no Redis.aclose).
    "types-PyYAML>=6.0.12.20261030",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "bandit>=1.9.4",
    # `safety` was removed (ADR-003, 2026-10-23): it duplicated pip-audit and
    # its filelock<4.0 pin kept a vulnerable filelock in this environment.
    "pip-audit>=2.10.1",
]
licenses = [
    "pip-licenses==5.5.5",
]
# Single-purpose group, installed only by the workflow that needs it
# (tools/deps/install_locked.sh group <name>) and kept out of the `full` profile.
# It lives here so the install is hash-verified from uv.lock like every other
# package, rather than an unhashed `pip install` in a workflow.
release = [
    "build>=1.2.2",
]

[tool.uv]
# Core-owned tools never enter uv.lock, even transitively (pytest plugins require
# pytest, pip-audit requires pip): a locked copy would drift the next time Core
# moves. tools/deps/install_locked.sh installs them from Core's installer pins
# (exact versions, so tools/mypy_ratchet.py still sees one mypy). Names only,
# never versions. Core list: l9-ci-core
# .github/actions/install-consumer-ci/core-owned-tools.json.
exclude-dependencies = ["mypy", "pip", "pre-commit", "pytest", "ruff", "semgrep"]

[tool.uv.sources]
# Policy (EIE-001, CEG#266): the manifest names Gate_SDK's moving major tag;
# uv.lock records the commit it resolved to (scripts/validate_sdk_pin.py).
constellation-node-sdk = { git = "https://github.com/Quantum-L9/Gate_SDK.git", tag = "v1" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gap-fixes", "WIP", "*.md", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = [
    "E501",     # formatter handles line length
    "TC001",    # typing-only first-party import — breaks Pydantic v2 validators at runtime
    "TC002",    # typing-only third-party import — same Pydantic v2 runtime issue
    "TC003",    # typing-only stdlib import — same Pydantic v2 runtime issue
    "SIM105",   # contextlib.suppress — explicit try/except is clearer in async+structlog code
    "TRY003",   # long exception messages acceptable in domain code
    "TRY400",   # logging.error vs logging.exception — both acceptable
    "ARG001",   # unused function args — handler interface compliance
    "ARG002",   # unused method args — handler interface compliance
    "ARG003",   # unused classmethod args — handler interface compliance
    "B007",     # unused loop variable — use _ prefix convention
    "B008",     # function-call-in-default-argument — FastAPI Depends() pattern is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PT011", "E741", "SIM102", "F841", "F821"]
"engine/config/**" = ["PLR2004"]
"tools/**" = ["PLC0415", "E741", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["app", "engine"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
exclude = ["app/engines/field_classifier\\.py", "app/engines/inference_bridge_v2\\.py"]

[[tool.mypy.overrides]]
module = ["app.engines.field_classifier", "app.engines.inference_bridge_v2"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (may need services)",
    "slow: Slow tests (enrichment, convergence)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
fail_under = 71
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
