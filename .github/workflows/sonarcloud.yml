# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [ci]
# tags: [sonarcloud, quality]
# owner: platform
# status: active
# --- /L9_META ---
# SonarQube Cloud — existing native project, public-API verified coordinates:
# organization quantum-l9 / project Quantum-L9_Enrichment.Inference.Engine.
# SONAR_TOKEN must authorize analysis of this project; hosted access is a native
# owner prerequisite, not established by the public component's visibility.
# Fork pull requests skip this entire secret-bearing job. A skipped job is
# not a quality-gate PASS and provides no analysis proof.
#
# This job does not run the test catalog. The pull-request selection is
# `make test`. The catalog, peers, and e2e are the deep plan in ci.yml.
# A missing SONAR_TOKEN fails this scan. It does not decide whether the
# catalog ran.

name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require SonarCloud analysis token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ ! "${SONAR_TOKEN:-}" =~ [^[:space:]] ]]; then
            echo "::error::SONAR_TOKEN is required for native SonarCloud analysis; no analysis or quality-gate proof was produced."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=quantum-l9
            -Dsonar.projectKey=Quantum-L9_Enrichment.Inference.Engine
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
