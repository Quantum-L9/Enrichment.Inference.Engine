# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [ci]
# tags: [sonarcloud, quality]
# owner: platform
# status: active
# --- /L9_META ---
# SonarQube Cloud — existing native project, public-API verified coordinates:
# organization quantum-l9 / project Quantum-L9_Enrichment.Inference.Engine.
# SONAR_TOKEN must authorize analysis of this project; hosted access is a native
# owner prerequisite, not established by the public component's visibility.
# Fork pull requests skip this entire secret-bearing job. A skipped job is
# not a quality-gate PASS and provides no analysis proof.

name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
      TEST_DIR: ${{ vars.TEST_DIR || 'tests/' }}
      COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '71' }}

    steps:
      - name: Require SonarCloud analysis token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ ! "${SONAR_TOKEN:-}" =~ [^[:space:]] ]]; then
            echo "::error::SONAR_TOKEN is required for native SonarCloud analysis; no analysis or quality-gate proof was produced."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Tests with coverage (Cobertura XML)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://${{ vars.POSTGRES_USER || 'test_user' }}:test_password@localhost:5432/${{ vars.POSTGRES_DB || 'test_db' }}
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          mapfile -t QUARANTINE_DESELECTS < <(python tools/pytest_quarantine_deselects.py)
          echo "Deselecting ${#QUARANTINE_DESELECTS[@]} quarantined tests from baseline ledger"
          pytest "${{ env.TEST_DIR }}" \
            -n auto \
            "${QUARANTINE_DESELECTS[@]}" \
            --cov=app \
            --cov=engine \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --timeout=300 \
            -q

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=quantum-l9
            -Dsonar.projectKey=Quantum-L9_Enrichment.Inference.Engine
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
