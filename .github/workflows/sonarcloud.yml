# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [ci]
# tags: [sonarcloud, quality]
# owner: platform
# status: active
# --- /L9_META ---
# SonarQube Cloud — existing native project, public-API verified coordinates:
# organization quantum-l9 / project Quantum-L9_Enrichment.Inference.Engine.
# SONAR_TOKEN must authorize analysis of this project; hosted access is a native
# owner prerequisite, not established by the public component's visibility.
# Fork pull requests skip this entire secret-bearing job. A skipped job is
# not a quality-gate PASS and provides no analysis proof.
#
# This job runs no tests. ci.yml calls it after its Test Suite job, on push to
# main and on same-repository pull requests. That job's single `make test` run
# measures PR-fast coverage of app/ and uploads it as coverage-pr-fast; after
# a deep apply on main, ci.yml calls it again with coverage-full from the deep
# plan's full catalog. This job downloads that artifact to coverage.xml, which
# sonar-project.properties names, and fails when it is absent: a scan without
# it reads as 0% coverage. Sonar's new-code gate then judges the changed lines
# that coverage exercises. The catalog, peers, and e2e are the deep plan in
# ci.yml.
# A missing SONAR_TOKEN fails this scan. It does not decide whether the
# catalog ran.

name: SonarCloud

on:
  workflow_call:
    inputs:
      coverage-artifact:
        description: >-
          Artifact holding coverage.xml from this run. coverage-pr-fast (the
          Test Suite job) for push and pull-request analyses; coverage-full
          (the deep plan's full catalog) for the main analysis after a deep
          apply.
        required: false
        type: string
        default: coverage-pr-fast
    secrets:
      SONAR_TOKEN:
        description: SonarQube Cloud analysis token, used by this job only.
        required: false

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require SonarCloud analysis token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ ! "${SONAR_TOKEN:-}" =~ [^[:space:]] ]]; then
            echo "::error::SONAR_TOKEN is required for native SonarCloud analysis; no analysis or quality-gate proof was produced."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ${{ inputs.coverage-artifact }}
          path: .

      - name: Require the coverage report
        run: |
          set -euo pipefail
          if [ ! -s coverage.xml ]; then
            echo "::error::coverage.xml from the Test Suite job is missing; the scan would read 0% coverage" >&2
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=quantum-l9
            -Dsonar.projectKey=Quantum-L9_Enrichment.Inference.Engine
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
