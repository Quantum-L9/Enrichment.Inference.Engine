# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [ci, governance]
# tags: [L9_TEMPLATE, ci, pr-pipeline, full-gate]
# owner: platform
# status: active
# --- /L9_META ---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Full PR Pipeline — GitHub Actions parity with `make pr`
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.0.0
# PURPOSE: Run the full PR pipeline in GitHub Actions.
# LOCAL EQUIVALENT: make pr-check (agent-check + local_pr_pipeline guards;
#                   never publishes). `make pr PR_BASE=<ref>` = pr-check, then
#                   publish through the governance ceremony.
#
# WHEN IT RUNS (automatic):
#   • Every pull_request (opened, synchronize, reopened) — all target branches GitHub allows.
#   • Push to PRIMARY_BRANCH / DEVELOP_BRANCH (vars or default main/develop).
#   • Manual: Actions → "PR Pipeline (Full Gate)" → Run workflow (with optional skip flags).
# It is a normal GitHub Actions workflow: it runs whenever those events occur; whether it
# blocks merge depends on branch protection "required checks" in repo settings.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: PR Pipeline (Full Gate)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_integration:
        description: 'Skip integration tests (PR_SKIP_INTEGRATION)'
        type: boolean
        default: false
      skip_semgrep:
        description: 'Skip Semgrep policy checks (PR_SKIP_SEMGREP)'
        type: boolean
        default: false
      skip_l9:
        description: 'Skip L9 constitution/contract checks (PR_SKIP_L9)'
        type: boolean
        default: false
      l9_minimal:
        description: 'Minimal L9 checks only (PR_L9_MINIMAL)'
        type: boolean
        default: false

concurrency:
  group: pr-pipeline-${{ github.ref }}
  cancel-in-progress: true

# Read-only default. The gate job, which comments on the PR, declares its own
# pull-requests: write; no job uploads SARIF, so security-events is not granted
# (SonarCloud githubactions:S8233).
permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '71' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # PHASE 1: VALIDATE
  # ────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate (syntax + YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml

      - name: Install validation tools
        # Hash-verified from uv.lock (pyyaml is a runtime dependency): never an
        # unhashed install (Scorecard Pinned-Dependencies, #215).
        run: |
          bash tools/deps/install_locked.sh runtime

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -not -path "./WIP/*" \
            -exec python -m py_compile {} +
          echo "✅ All Python files have valid syntax"

      - name: Validate workflow YAML
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          errors = []
          for f in Path('.github/workflows').glob('*.yml'):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'❌ {e}')
              raise SystemExit(1)
          print('✅ All workflow YAML files are valid')
          "

      - name: Validate KB YAML
        run: |
          python3 local_pr_pipeline/compliance_kb_validate.py

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 2: LINT
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff + Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml

      - name: Install linting tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Run Ruff linter
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "✅ Ruff checks passed"

      - name: Run Ruff formatter check
        run: |
          echo "Checking code formatting..."
          ruff format --check .
          echo "✅ Code formatting is consistent"

      - name: Run Mypy type checker
        run: |
          echo "Running type checks..."
          mypy app --show-error-codes --pretty --ignore-missing-imports

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 3: SEMGREP
  # ────────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    if: ${{ !inputs.skip_semgrep }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Semgrep is Core-owned: its version is Quantum-L9/l9-ci-core
      # toolchain-lock.json's, installed hash-locked by Core's installer (on by
      # default). The lock is built for CPython 3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Core toolchain (Semgrep included)
        id: core
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@v2

      - name: Run Semgrep
        env:
          SEMGREP: ${{ steps.core.outputs.semgrep-executable }}
        run: |
          set -euo pipefail
          if [[ -z "${SEMGREP}" ]]; then
            echo "::error::install-consumer-ci@v2 did not install Semgrep (v2 predates Quantum-L9/l9-ci-core#248)"
            exit 1
          fi
          echo "Running Semgrep policy checks..."
          "${SEMGREP}" --config .semgrep/ --error --quiet --metrics=off --disable-version-check
          echo "✅ Semgrep checks passed"

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 4: TEST
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Read pinned CEG revision
        id: ceg_pin
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tests/contracts/ceg_revision.py").read_text(encoding="utf-8")
          found = re.search(r'^CEG_REVISION = "([0-9a-f]{40})"$', text, re.M)
          if found is None:
              raise SystemExit("CEG_REVISION is not one 40-character revision")
          print(found.group(1))
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CEG_SUBJECT_SHA=$sha" >> "$GITHUB_ENV"
      - name: Checkout pinned native CEG subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: ${{ steps.ceg_pin.outputs.sha }}
          path: .ci-subjects/ceg
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false

      - name: Prepare native CEG validator
        shell: bash
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/.ci-subjects/ceg"
          test "$(git -C "$subject" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          python -m venv "$RUNNER_TEMP/ceg-native-venv"
          native_python="$RUNNER_TEMP/ceg-native-venv/bin/python"
          # CEG's own hash-locked runtime profile (uv sync --locked against its
          # uv.lock; uv itself bootstrapped with pip --require-hashes), as its
          # production image installs it (CEG pins nothing outside uv.lock).
          PYTHON="$native_python" bash "$subject/tools/deps/install_locked.sh" runtime
          # Import/CLI only: no CEG service, graph connection, or approval.
          "$native_python" "$subject/tools/validate_domain.py" --help
          echo "L9_CEG_NATIVE_REPO=$subject" >> "$GITHUB_ENV"
          echo "L9_CEG_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"

      - name: Run PR-fast tests
        # Codecov upload deferred. This job no longer builds a full-catalog
        # coverage.xml, and Codecov authentication is out of scope. The full
        # catalog runs only from ci.yml's deep plan.
        run: make test-fast

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 5: SECURITY
  # ────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Install gitleaks (binary — no org license required)
        # Version and SHA-256 are the pin Quantum-L9/l9-ci-core selects
        # (.github/actions/install-consumer-ci/tool-ownership.json,
        # .github/workflows/security.yml); gitleaks.yml uses the same pair.
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --tlsv1.2 -sSfL "$url" -o gitleaks.tar.gz
          actual_sha="$(sha256sum gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks (secret detection)
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
      # pip-audit and bandit are Core-owned; EIE installs and runs neither
      # (CI-UL, 2026-11-21). Core's security job (l9-ci-core #312) runs both
      # from Core's toolchain lock in the org-required `Analyze (central Core)`.

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 6: COMPLIANCE
  # ────────────────────────────────────────────────────────────────────────
  compliance:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install compliance tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Terminology Guard
        run: |
          python3 local_pr_pipeline/check_compliance_terminology.py

      - name: Chassis Isolation Check
        run: |
          echo "Checking chassis isolation..."
          VIOLATIONS=$(find app/ -name "*.py" \
            -not -path "app/api/*" \
            -not -path "app/bootstrap/*" \
            -not -path "app/middleware/*" \
            -not -path "app/main.py" \
            -not -path "app/core/auth.py" \
            -not -path "app/score/score_api.py" \
            -not -name "handlers.py" \
            -exec grep -l "from fastapi import\|import fastapi" {} + 2>/dev/null || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ FastAPI imports found outside allowed modules:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ Chassis isolation is maintained"

      - name: KB YAML Schema Validation
        run: |
          python3 local_pr_pipeline/compliance_kb_validate.py

      - name: L9 Contract Audit (if available)
        run: |
          if [ -f "tools/audit_engine.py" ]; then
            echo "Running L9 contract audit..."
            PYTHONPATH=. python tools/audit_engine.py --strict || echo "⚠️ Contract audit warnings (non-blocking)"
          fi

      - name: L9 Contract Verification (merge-blocking)
        run: |
          if [ -f "tools/verify_contracts.py" ]; then
            echo "Running L9 contract verification..."
            PYTHONPATH=. python tools/verify_contracts.py
          fi

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 7: L9 CONSTITUTION + CONTRACT CONTROL
  # ────────────────────────────────────────────────────────────────────────
  l9:
    name: L9 Constitution Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    if: ${{ !inputs.skip_l9 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install L9 dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SDK_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # The full locked profile: every package at the version uv.lock records,
          # hash-verified, plus the project itself and the Gate SDK at the commit
          # uv.lock resolved `v1` to. This replaces a hand-pinned wheel list that
          # had drifted from the lock (fastapi 0.141.1, pydantic 2.13.4 while the
          # lock carried 0.161.0 and 2.14.1). The contract gates selected for app/
          # changes import app.engines.handlers / app.api.v1.converge, which load
          # sqlalchemy.ext.asyncio (+ greenlet), perplexity and defusedxml; all are
          # [project] dependencies, so the locked install always carries them.
          bash tools/deps/install_locked.sh full

      - name: Read pinned CEG revision
        id: ceg_pin
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tests/contracts/ceg_revision.py").read_text(encoding="utf-8")
          found = re.search(r'^CEG_REVISION = "([0-9a-f]{40})"$', text, re.M)
          if found is None:
              raise SystemExit("CEG_REVISION is not one 40-character revision")
          print(found.group(1))
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CEG_SUBJECT_SHA=$sha" >> "$GITHUB_ENV"
      - name: Checkout pinned native CEG subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: ${{ steps.ceg_pin.outputs.sha }}
          path: .ci-subjects/ceg
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false

      - name: Prepare native CEG validator
        shell: bash
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/.ci-subjects/ceg"
          test "$(git -C "$subject" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          python -m venv "$RUNNER_TEMP/ceg-native-venv"
          native_python="$RUNNER_TEMP/ceg-native-venv/bin/python"
          # CEG's own hash-locked runtime profile (uv sync --locked against its
          # uv.lock; uv itself bootstrapped with pip --require-hashes), as its
          # production image installs it (CEG pins nothing outside uv.lock).
          PYTHON="$native_python" bash "$subject/tools/deps/install_locked.sh" runtime
          # Import/CLI only: no CEG service, graph connection, or approval.
          "$native_python" "$subject/tools/validate_domain.py" --help
          echo "L9_CEG_NATIVE_REPO=$subject" >> "$GITHUB_ENV"
          echo "L9_CEG_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"

      - name: Verify node constitution
        run: |
          python scripts/verify_node_constitution.py

      - name: Verify constitution (l9_contract_control)
        run: |
          python scripts/l9_contract_control.py verify-constitution

      - name: Verify attestation (l9_contract_control)
        run: |
          # F-029: an attestation that cannot be built is a failure, not a skip.
          python scripts/l9_contract_control.py verify-attestation

      - name: Select and run gates (PR only)
        if: github.event_name == 'pull_request' && !inputs.l9_minimal
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          echo "L9 select-gates: base=$BASE_REF head=$HEAD_REF"
          if [ -n "${SDK_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # Packet/envelope gates need the SDK transport types. "Install L9
          # dependencies" installed the SDK from uv.lock with everything else, so
          # these gates validate packets against the same SDK object every other
          # job and the image use. This step used to install `@v1` live — a third
          # Gate_SDK identity beside the manifests (ead0f48 vs 69c6c67 once, EIE-001);
          # scripts/validate_sdk_pin.py now fails any workflow that installs the
          # SDK directly instead of from the lock.
          python scripts/l9_contract_control.py select-gates --base "$BASE_REF" --head "$HEAD_REF" > gates.json
          python3 local_pr_pipeline/run_pr_select_gates.py gates.json

      - name: Contract-bound change gate (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 local_pr_pipeline/contract_bound_local.py --base "$BASE_REF" --head "$HEAD_REF" || echo "⚠️ Contract-bound check (advisory)"

  # ────────────────────────────────────────────────────────────────────────
  # PHASE 8: DOCS CONSISTENCY
  # ────────────────────────────────────────────────────────────────────────
  docs:
    name: Docs Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run docs consistency checks
        run: |
          bash local_pr_pipeline/docs_consistency_local.sh

      - name: Run markdown link check
        run: |
          python3 local_pr_pipeline/docs_link_check_local.py

  # ────────────────────────────────────────────────────────────────────────
  # FINAL GATE: PR Pipeline Summary
  # ────────────────────────────────────────────────────────────────────────
  pr-pipeline-gate:
    name: PR Pipeline Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Upserts the pipeline summary comment (issues.listComments /
    # createComment / updateComment on the pull request).
    permissions:
      pull-requests: write
    if: always()
    needs:
      - validate
      - lint
      - semgrep
      - test
      - security
      - compliance
      - l9
      - docs

    steps:
      - name: Evaluate all results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "PR Pipeline Results (parity with make pr)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Job Results:"
          echo "  validate:   ${{ needs.validate.result }}"
          echo "  lint:       ${{ needs.lint.result }}"
          echo "  semgrep:    ${{ needs.semgrep.result }}"
          echo "  test:       ${{ needs.test.result }}"
          echo "  security:   ${{ needs.security.result }}"
          echo "  compliance: ${{ needs.compliance.result }}"
          echo "  l9:         ${{ needs.l9.result }}"
          echo "  docs:       ${{ needs.docs.result }}"
          echo ""

          # Check for failures in required jobs
          FAILED=0
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "❌ validate FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ lint FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.semgrep.result }}" != "success" ]]; then
            echo "❌ semgrep FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ test FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ security FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.compliance.result }}" != "success" ]]; then
            echo "❌ compliance FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.l9.result }}" != "success" ]]; then
            echo "❌ l9 FAILED"
            FAILED=1
          fi
          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "❌ docs FAILED"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ PR PIPELINE GATE FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "Fix the failing jobs above before merging."
            echo "Local equivalent: make pr"
            exit 1
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ PR PIPELINE GATE PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "All checks completed successfully."
          echo "Ready for code review and merge."

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = "<!-- pr-pipeline-gate-summary -->";
            const results = {
              validate: "${{ needs.validate.result }}",
              lint: "${{ needs.lint.result }}",
              semgrep: "${{ needs.semgrep.result }}",
              test: "${{ needs.test.result }}",
              security: "${{ needs.security.result }}",
              compliance: "${{ needs.compliance.result }}",
              l9: "${{ needs.l9.result }}",
              docs: "${{ needs.docs.result }}"
            };

            const icon = (r) => r === "success" ? "✅" : r === "skipped" ? "⏭️" : r === "failure" ? "❌" : "⚠️";
            const allPassed = Object.values(results).every(r => r === "success");

            let body = `${marker}\n## PR Pipeline Gate Summary\n\n`;
            body += `| Phase | Status |\n|-------|--------|\n`;
            for (const [job, result] of Object.entries(results)) {
              body += `| ${job} | ${icon(result)} ${result} |\n`;
            }
            body += `\n`;
            body += allPassed
              ? `### ✅ All checks passed\n\nReady for code review and merge.\n`
              : `### ❌ Some checks failed\n\nFix the failing jobs before merging.\n`;
            body += `\n_Local equivalent: \`make pr\` · Job: ${context.runId}_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c => c.user.type === "Bot" && c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
