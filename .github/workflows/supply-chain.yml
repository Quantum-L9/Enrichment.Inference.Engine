# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [ci]
# tags: [L9_TEMPLATE, ci, security]
# owner: platform
# status: active
# --- /L9_META ---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Universal CI/CD Pack — Supply Chain Security
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.2.0
# CHANGES v1.1.0: Added CycloneDX SBOM generation job (SOC 2 CC9.2)
# CHANGES v1.1.1: Exact SPDX token matching in GPL/AGPL audit
#   - P1 fix: substring 'gpl' falsely matched 'lgpl' — use exact SPDX token set
#   - P2 fix: also inspect licenses[].license.name (not just id/expression)
# CHANGES v1.1.2: PR #94 review remediation
#   - SBOM install no longer fails open (removed `|| true`)
#   - Pinned cyclonedx-bom to a reviewed version for reproducible SBOMs
#   - SBOM audit also catches spelled-out GPL/AGPL license names
#   - persist-credentials:false on the SBOM checkout (scan-only job)
#   - Fixed pip-licenses `--format=table` (dropped upstream) -> `plain`
# CHANGES v1.2.0: SBOM generated by Syft, not cyclonedx-bom (operator decision)
#   - cyclonedx-bom is no longer pip-installed: it pulls chardet (LGPL-2.1+)
#     and rfc3987-syntax (GPL, via jsonschema[format]), which the
#     permissive-only Dependency Review policy rejects. It was a CI-only tool;
#     no licence exception is taken for it.
#   - anchore/sbom-action (Syft, SHA-pinned, as ci.yml/docker-build.yml use it)
#     writes CycloneDX JSON for the uv.lock environment installed in .sbom-env
#   - The GPL/AGPL audit also reads each Python package's `License ::`
#     classifiers from the scanned METADATA (Syft reports only License /
#     License-Expression), fails on an unreadable METADATA, and fails on an SBOM
#     with no Python packages
#   - Workflow-level permissions reduced to contents: read; each job declares
#     its own (SonarCloud githubactions:S8233/S8264)
# PURPOSE: License compliance, dependency review, SBOM generation
# SIBLING PARITY: Cognitive.Engine.Graphs/supply-chain.yml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Supply Chain Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

# Read-only default; a job that needs more declares it (least privilege).
permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}

jobs:
# ────────────────────────────────────────────────────────────────────────
# License Compliance
# ────────────────────────────────────────────────────────────────────────
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Check License Compliance
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "License Compliance Report"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ALLOWED="${{ vars.ALLOWED_LICENSES || 'MIT;BSD;Apache;ISC;PSF;MPL;LGPL;Unlicense;Public Domain' }}"
          DENIED="${{ vars.DENIED_LICENSES || 'GPL-3.0;AGPL;SSPL;EUPL' }}"

          pip-licenses --format=plain --with-urls --order=license

          echo ""
          echo "Checking for denied licenses..."

          IFS=';' read -ra DENY_LIST <<< "$DENIED"
          VIOLATIONS=0
          for license in "${DENY_LIST[@]}"; do
            if pip-licenses --format=csv | grep -qi "$license"; then
              echo "❌ Found denied license: $license"
              pip-licenses --format=plain | grep -i "$license"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "❌ $VIOLATIONS license violation(s) found"
            exit 1
          fi

          echo "✅ All licenses are compliant"

      - name: Generate License Report
        run: |
          pip-licenses --format=json --with-urls --order=license > license-report.json
          pip-licenses --format=plain --with-urls --order=license > license-report.txt

      - name: Upload License Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: license-report
          path: |
            license-report.json
            license-report.txt
          retention-days: 30

# ────────────────────────────────────────────────────────────────────────
# Dependency Review (PR only)
# ────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
          # Policy lives here, not in vars.PIP_LICENSES_DENY (operator decision
          # 2026-11-11, same policy as Cognitive.Engine.Graphs supply-chain.yml):
          # permissive licences only. allow-licenses and deny-licenses are
          # mutually exclusive, and deny-licenses is deprecated upstream; the
          # allow-list is the stricter of the two. uv.lock is a manifest
          # GitHub's dependency graph reads, so the whole locked set is checked.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, MPL-2.0, PSF-2.0,
            Python-2.0, MIT-0, 0BSD, Zlib, CC0-1.0, HPND-Markus-Kuhn
          # Exempted by name, each reviewed 2026-11-11:
          # - AND-compounds of allowed licences, which this action does not
          #   match: colorama, httpcore, nodeenv (BSD-2 AND BSD-3); sniffio,
          #   types-pyyaml (Apache-2.0 AND MIT); wcwidth (HPND AND MIT); greenlet
          #   (MIT AND PSF-2.0); mypy (MIT AND Python-2.0 AND BSD-2-Clause,
          #   Core-owned dev tool). pip-audit, pip-requirements-parser and
          #   cyclonedx-python-lib left uv.lock with pip-audit (Core-owned,
          #   2026-11-21), so their exemptions are removed.
          # - typing-extensions: PSF-2.0; the detected "GPL-1.0-or-later" comes
          #   from the PSF licence history text, not a GPL grant.
          # - protobuf: BSD-3-Clause AND LicenseRef-scancode-protobuf (Google's
          #   BSD-3-style protobuf notice); flagged on #307's first run.
          # - structlog (MIT OR Apache-2.0), prometheus-client (Apache-2.0 AND
          #   BSD-2-Clause): the exemptions Cognitive.Engine.Graphs carries for
          #   the same packages.
          allow-dependencies-licenses: >-
            pkg:pypi/structlog, pkg:pypi/prometheus-client, pkg:pypi/mypy,
            pkg:pypi/colorama, pkg:pypi/httpcore, pkg:pypi/nodeenv,
            pkg:pypi/sniffio, pkg:pypi/types-pyyaml, pkg:pypi/wcwidth,
            pkg:pypi/greenlet, pkg:pypi/typing-extensions,
            pkg:pypi/protobuf
          comment-summary-in-pr: on-failure

# ────────────────────────────────────────────────────────────────────────
# CycloneDX SBOM Generation (SOC 2 CC9.2)
# ────────────────────────────────────────────────────────────────────────
  cyclonedx-sbom:
    name: CycloneDX SBOM (SOC 2 CC9.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on push to main AND on PRs so SBOM is visible before merge
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # scan-only job — do not retain git push credentials

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install the locked environment (uv.lock)
        # Do NOT fail open: a failed project install must fail the job, otherwise
        # the SBOM/audit would only reflect a partial environment. The locked
        # set goes to its own environment so Syft scans exactly that, not the
        # runner's tool cache.
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.sbom-env
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
          mkdir -p artifacts

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .sbom-env
          format: cyclonedx-json
          output-file: artifacts/sbom-eie.json
          upload-artifact: false
          upload-release-assets: false

      - name: Summarise SBOM
        run: |
          echo "✅ SBOM generated: artifacts/sbom-eie.json"
          echo "Component count: $(python3 -c "import json; d=json.load(open('artifacts/sbom-eie.json')); print(len(d.get('components', [])))")"

      - name: GPL/AGPL license audit (hard fail)
        # P1 fix: use exact SPDX token set — 'lgpl' no longer triggers the gate
        # P2 fix: inspect all three CycloneDX license fields:
        #   licenses[].expression, licenses[].license.id, licenses[].license.name
        # v1.2.0: Syft reports License / License-Expression only, so each Python
        #   package's `License ::` classifiers are read from the METADATA Syft
        #   located (syft:location:0:path, relative to the scanned SBOM_ENV).
        #   An unreadable METADATA or an SBOM with no Python package fails.
        env:
          SBOM_ENV: .sbom-env
        run: |
          echo "Scanning SBOM for GPL/AGPL licenses (exact SPDX tokens)..."
          python3 - <<'PYEOF'
          import json, os, sys, re
          from email.parser import HeaderParser

          # Exact SPDX identifiers that are banned — LGPL is explicitly excluded
          BANNED_SPDX = {
              "GPL-2.0", "GPL-2.0-only", "GPL-2.0-or-later",
              "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later",
              "AGPL-1.0", "AGPL-1.0-only", "AGPL-1.0-or-later",
              "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later",
          }

          # Token-based pattern for expression strings (e.g. "GPL-3.0 OR MIT")
          # Matches exact SPDX tokens; does NOT match LGPL-2.0 etc.
          BANNED_PATTERN = re.compile(
              r'(?<![A-Za-z-])(' + '|'.join(re.escape(t) for t in BANNED_SPDX) + r')(?![A-Za-z0-9.-])'
          )

          def banned_name(text):
              # Catch both SPDX tokens and spelled-out names ("GNU General Public
              # License v3.0", "GNU Affero General Public License"), while
              # excluding LGPL / Lesser.
              gpl = re.search(
                  r'\b(?:GNU\s+)?(?:Affero\s+)?General\s+Public\s+License\b',
                  text, re.IGNORECASE,
              )
              lesser = re.search(
                  r'\b(?:LGPL|Lesser\s+General\s+Public\s+License)\b',
                  text, re.IGNORECASE,
              )
              return bool(BANNED_PATTERN.search(text) or (gpl and not lesser))

          def prop(comp, key):
              for p in comp.get('properties', []) or []:
                  if p.get('name') == key:
                      return p.get('value')
              return None

          with open('artifacts/sbom-eie.json') as f:
              sbom = json.load(f)

          env_root = os.environ['SBOM_ENV']
          hits, unreadable, python_pkgs = [], [], 0
          for comp in sbom.get('components', []):
              name = comp.get('name', '?')
              for lic in comp.get('licenses', []):
                  # Field 1: expression (e.g. "GPL-3.0 OR MIT")
                  expr = lic.get('expression', '') or ''
                  if BANNED_PATTERN.search(expr):
                      hits.append(f"{name} — expression: {expr}")
                      continue
                  inner = lic.get('license', {})
                  # Field 2: license.id (SPDX identifier)
                  lic_id = inner.get('id', '') or ''
                  if lic_id in BANNED_SPDX:
                      hits.append(f"{name} — id: {lic_id}")
                      continue
                  # Field 3: license.name (free-form)
                  lic_name = inner.get('name', '') or ''
                  if banned_name(lic_name):
                      hits.append(f"{name} — name: {lic_name}")

              # Field 4: the package's own `License ::` trove classifiers.
              if prop(comp, 'syft:package:type') != 'python':
                  continue
              python_pkgs += 1
              located = prop(comp, 'syft:location:0:path') or ''
              meta_path = os.path.join(env_root, located.lstrip('/'))
              if not located.endswith('METADATA') or not os.path.isfile(meta_path):
                  unreadable.append(f"{name} — {located or 'no location'}")
                  continue
              with open(meta_path, encoding='utf-8', errors='replace') as f:
                  meta = HeaderParser().parse(f)
              for classifier in meta.get_all('Classifier') or []:
                  if classifier.startswith('License ::') and banned_name(classifier):
                      hits.append(f"{name} — classifier: {classifier}")

          if unreadable:
              print("METADATA NOT READABLE (cannot prove licence):")
              for u in unreadable:
                  print(f"  {u}")
          if python_pkgs == 0:
              print(f"NO PYTHON PACKAGES in SBOM — {env_root} was not scanned")
          if hits:
              print("VIOLATIONS FOUND:")
              for h in hits:
                  print(f"  {h}")
          if hits or unreadable or python_pkgs == 0:
              sys.exit(1)

          print(f"PASS: no GPL/AGPL detected ({len(sbom.get('components', []))} components, {python_pkgs} Python packages scanned)")
          PYEOF

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-eie-${{ github.sha }}
          path: artifacts/sbom-eie.json
          retention-days: 90

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# END OF SUPPLY CHAIN SECURITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
