# --- L9_META ---
# l9_schema: 1
# origin: l9-implementer
# engine: enrichment
# layer: [ci, security]
# tags: [gitleaks, secrets, soc2-cc6.1]
# owner: platform
# status: active
# --- /L9_META ---
#
# Gitleaks secret scanning — hard CI gate (SOC 2 CC6.1)
#
# Distinct from gitguardian.yml:
#   - gitguardian.yml uses ggshield but SOFT-SKIPS when GITGUARDIAN_API_KEY is unset
#   - This workflow is a hard gate: always runs, no soft-skip path
#   - Uses repo-local .gitleaks.toml (10 L9-specific rules)
#
# Action: gitleaks/gitleaks-action@v3
# Pre-condition: org/repo secret GITLEAKS_LICENSE (Settings → Secrets → Actions)
# Local/offline fallback: bash scripts/run_gitleaks_cli.sh

name: Gitleaks Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scanning (SOC 2 CC6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required for gitleaks --log-opts
          persist-credentials: false  # scan-only job — do not retain git push credentials

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
        # Hard fail — no soft-skip path. SOC 2 CC6.1 requires blocking gate.
