#
# Gitleaks secret scanning — hard CI gate (SOC 2 CC6.1)
#
# Distinct from gitguardian.yml:
#   - gitguardian.yml uses ggshield but SOFT-SKIPS when GITGUARDIAN_API_KEY is unset
#   - This workflow is a hard gate: always runs, no soft-skip path
#   - Uses repo-local .gitleaks.toml (10 L9-specific rules)
#
# Implementation: open-source gitleaks CLI via scripts/run_gitleaks_cli.sh
#   (no Gitleaks-Action org license / GITLEAKS_LICENSE required).
#   Pin: GITLEAKS_VERSION default 8.30.1 in the install script.

name: Gitleaks Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scanning (SOC 2 CC6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required for gitleaks detect
          persist-credentials: false  # scan-only job — do not retain git push credentials

      - name: Gitleaks CLI scan
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: bash scripts/run_gitleaks_cli.sh
        # Hard fail — no soft-skip path. SOC 2 CC6.1 requires blocking gate.
