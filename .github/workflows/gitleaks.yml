# --- L9_META ---
# l9_schema: 1
# origin: l9-implementer
# engine: enrichment
# layer: [ci, security]
# tags: [gitleaks, secrets, soc2-cc6.1]
# owner: platform
# status: active
# --- /L9_META ---
#
# Gitleaks secret scanning — hard CI gate (SOC 2 CC6.1)
#
# Distinct from gitguardian.yml:
#   - gitguardian.yml uses ggshield but SOFT-SKIPS when GITGUARDIAN_API_KEY is unset
#   - This workflow is a hard gate: always runs, no soft-skip path
#   - Uses repo-local .gitleaks.toml (10 L9-specific rules)
#
# Action pin: gitleaks/gitleaks-action@v2.3.6
#   SHA: f6d28b60c0e56e48b77e6e05ae47c3fc9b22e77f
#   Pinned 2026-05-25 per supply-chain hardening (mutable tags can be overwritten)
#   To update: verify new SHA at https://github.com/gitleaks/gitleaks-action/releases
#
# Pre-condition: Set GITLEAKS_LICENSE in Settings → Secrets → Actions
#   Free org license: https://gitleaks.io/products.html

name: Gitleaks Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scanning (SOC 2 CC6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history required for gitleaks --log-opts
          persist-credentials: false  # scan-only job — do not retain git push credentials

      # SOC 2 CC6.1 evidence trail for Dependabot events.
      #
      # GitHub isolates Dependabot-triggered pull_request events from repository
      # Actions secrets by design (only the separate Dependabot secrets store is
      # exposed). GITLEAKS_LICENSE is required by gitleaks-action on org accounts,
      # so under Dependabot the step cannot execute. Rather than hard-fail the
      # gate on trusted dep-bump diffs (which contain no user code and no new
      # secrets — only manifest bumps authored by GitHub's Dependabot bot), we
      # record a documented, auditable skip and emit it to the run summary.
      #
      # To eliminate the skip entirely, mirror GITLEAKS_LICENSE into
      # Settings → Secrets and variables → Dependabot.
      - name: Record Dependabot secret-context skip (SOC 2 evidence)
        if: github.actor == 'dependabot[bot]'
        run: |
          {
            echo "### Secret scanning (SOC 2 CC6.1) — Dependabot event skip"
            echo
            echo "- **Actor:** \`${{ github.actor }}\`"
            echo "- **Event:** \`${{ github.event_name }}\`"
            echo "- **Rationale:** Dependabot pull_request events run without access to Actions secrets; \`GITLEAKS_LICENSE\` is not available in this context. Dep-only diffs contain no user code and no new secrets — SOC 2 CC6.1 posture is preserved by the post-merge push-to-main scan."
            echo "- **Remediation to eliminate skip:** mirror \`GITLEAKS_LICENSE\` into the Dependabot secrets store."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gitleaks scan
        # Skip on Dependabot pull_request events (see audit note above).
        # The equivalent scan runs on push to main after merge, where secrets
        # are available.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f  # v2.3.6
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Hard fail — no soft-skip path outside the Dependabot exception.
        # SOC 2 CC6.1 requires blocking gate. If GITLEAKS_LICENSE is unset on
        # a non-Dependabot event, this step fails with a license error, which
        # is intentional — add the secret first.
