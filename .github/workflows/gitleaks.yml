# --- L9_META ---
# l9_schema: 1
# origin: l9-implementer
# engine: enrichment
# layer: [ci, security]
# tags: [gitleaks, secrets, soc2-cc6.1]
# owner: platform
# status: active
# --- /L9_META ---
#
# Gitleaks secret scanning — hard CI gate (SOC 2 CC6.1)
#
# Distinct from gitguardian.yml:
#   - gitguardian.yml is the vendor (ggshield) scan; it needs GITGUARDIAN_API_KEY
#   - This workflow uses repo-local .gitleaks.toml (10 L9-specific rules)
#
# Every event this workflow runs on executes a Gitleaks scan or fails. There
# is no path that ends green without one:
#   - non-Dependabot events: gitleaks/gitleaks-action (needs GITLEAKS_LICENSE)
#   - Dependabot events: the licence-free Gitleaks binary, same .gitleaks.toml
# The last step writes one status line (EXECUTED_CLEAN, EXECUTED_FINDINGS, FAILED
# or NOT_EXECUTED) to the run summary. Contract: tests/ci/test_secret_scan_truthfulness.py
#
# Action pin: gitleaks/gitleaks-action v2.3.6, by commit SHA on the `uses:` line
#   (mutable tags can be overwritten)
#   To update: verify new SHA at https://github.com/gitleaks/gitleaks-action/releases
#
# Binary pin: Gitleaks 8.24.3, the version and SHA-256 Quantum-L9/l9-ci-core
#   selects (.github/actions/install-consumer-ci/tool-ownership.json,
#   .github/workflows/security.yml). Core owns that pin; change it there first.
#
# Pre-condition: Set GITLEAKS_LICENSE in Settings → Secrets → Actions
#   Free org license: https://gitleaks.io/products.html

name: Gitleaks Secret Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # gitleaks-action@v2.3.6 (src/gitleaks.js ScanPullRequest) calls
  # GET /repos/{owner}/{repo}/pulls/{n}/commits to bound the PR scan range.
  # Without this scope that call returns 403 "Resource not accessible by
  # integration" and the scan never executes (PR #231, job 114356059936).
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    name: Secret scanning (SOC 2 CC6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Core-owned pin (see header). Used on Dependabot events only.
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history required for gitleaks --log-opts
          persist-credentials: false  # scan-only job — do not retain git push credentials

      # Dependabot events.
      #
      # GitHub does not expose repository Actions secrets to Dependabot-triggered
      # pull_request events (only the separate Dependabot secrets store), and
      # gitleaks-action requires GITLEAKS_LICENSE on organization accounts. The
      # action therefore cannot run for this actor: SKIPPED_BY_POLICY.
      #
      # The scan itself still runs before merge. The Gitleaks binary needs no
      # licence and no secret, so these two steps scan the same history with the
      # same .gitleaks.toml. Hosted evidence that the binary runs on a Dependabot
      # event without secrets: PR #363, run 44302687914, job 134796313841
      # ("Run Gitleaks (secret detection)", success, actor dependabot[bot]).
      - name: Install Gitleaks binary (Dependabot events)
        id: install_binary
        if: github.actor == 'dependabot[bot]'
        shell: bash
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          workdir="$(mktemp -d)"
          if ! curl --proto "=https" --tlsv1.2 -sSfL --retry 3 -o "${workdir}/gitleaks.tar.gz" "$url"; then
            echo "::error::NOT_EXECUTED: Gitleaks ${GITLEAKS_VERSION} could not be downloaded; no scan ran."
            exit 1
          fi
          actual_sha="$(sha256sum "${workdir}/gitleaks.tar.gz" | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::NOT_EXECUTED: Gitleaks checksum mismatch (got ${actual_sha}); no scan ran."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${workdir}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Gitleaks scan (Dependabot events, binary)
        id: binary_scan
        if: github.actor == 'dependabot[bot]'
        shell: bash
        run: |
          set +e
          gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1
          rc=$?
          set -e
          # Gitleaks exits 0 with no leaks and --exit-code (1) with leaks; any
          # other code means the scan did not complete.
          case "$rc" in
            0) result=EXECUTED_CLEAN ;;
            1) result=EXECUTED_FINDINGS ;;
            *) result=NOT_EXECUTED ;;
          esac
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "gitleaks_exit_code=${rc}" >> "$GITHUB_OUTPUT"
          if [ "$result" = "EXECUTED_FINDINGS" ]; then
            echo "::error::EXECUTED_FINDINGS: Gitleaks reported leaks (exit ${rc})."
          elif [ "$result" = "NOT_EXECUTED" ]; then
            echo "::error::NOT_EXECUTED: Gitleaks exited ${rc}; the scan did not complete."
          fi
          exit "$rc"

      - name: Gitleaks scan
        id: action_scan
        # gitleaks-action is SKIPPED_BY_POLICY on Dependabot events (see above);
        # the binary scan covers them.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f  # v2.3.6
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Hard fail. SOC 2 CC6.1 requires a blocking gate. If GITLEAKS_LICENSE
        # is unset on a non-Dependabot event, this step fails with a license
        # error, which is intentional — add the secret first.

      - name: Report scan status
        if: always()
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_OUTCOME: ${{ steps.install_binary.outcome }}
          BINARY_OUTCOME: ${{ steps.binary_scan.outcome }}
          BINARY_RESULT: ${{ steps.binary_scan.outputs.result }}
          ACTION_OUTCOME: ${{ steps.action_scan.outcome }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            scanner="gitleaks binary ${GITLEAKS_VERSION} (gitleaks-action: SKIPPED_BY_POLICY — Actions secrets, including GITLEAKS_LICENSE, are not exposed to Dependabot events)"
            if [ "$INSTALL_OUTCOME" != "success" ]; then
              status=NOT_EXECUTED
              detail="the Gitleaks binary was not installed (install step: ${INSTALL_OUTCOME:-not run})"
            elif [ -n "$BINARY_RESULT" ]; then
              status="$BINARY_RESULT"
              detail="binary scan step: ${BINARY_OUTCOME}"
            else
              status=NOT_EXECUTED
              detail="the binary scan step produced no result (step: ${BINARY_OUTCOME:-not run})"
            fi
          else
            scanner="gitleaks/gitleaks-action v2.3.6"
            case "$ACTION_OUTCOME" in
              success)
                status=EXECUTED_CLEAN
                detail="action step: success"
                ;;
              failure)
                status=FAILED
                detail="action step: failure — leaks were reported, or the action did not scan (for example a missing GITLEAKS_LICENSE); the step log states which. This is not a pass."
                ;;
              *)
                status=NOT_EXECUTED
                detail="the action step did not run (step: ${ACTION_OUTCOME:-not run})"
                ;;
            esac
          fi
          {
            echo "### Secret scanning (SOC 2 CC6.1) — Gitleaks"
            echo
            echo "- **Status:** \`${status}\`"
            echo "- **Scanner:** ${scanner}"
            echo "- **Detail:** ${detail}"
            echo "- **Actor / event:** \`${ACTOR}\` / \`${EVENT_NAME}\`"
            echo "- **Commit:** \`${HEAD_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks status: ${status} (${detail})"
          # A job that did not execute a scan never ends green.
          if [ "$status" = "NOT_EXECUTED" ]; then
            echo "::error::NOT_EXECUTED: no Gitleaks scan ran for this event (${detail})."
            exit 1
          fi
