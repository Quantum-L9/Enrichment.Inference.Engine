# Release — NOT triggered by push to main. Runs only when a version tag is pushed.
# WHEN: git tag v1.2.3 && git push origin v1.2.3  (semantic version pattern v*.*.*)
# WHAT: build sdist/wheel, create GitHub Release with artifacts + generated notes.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        # The `release` dependency group, hash-verified from uv.lock.
        run: bash tools/deps/install_locked.sh group release

      - name: Build distribution
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
