# L9 Constitution Gate - verifies node.constitution.yaml, inventories, and contract-bound PR edits.
# Human-maintained accuracy matrix: docs/contracts/VERIFICATION_MATRIX.md

name: L9 Constitution Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  constitution-verify:
    name: Constitution Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SDK_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # pyyaml, fastapi and structlog are [project] dependencies: install
          # them from uv.lock, hash-verified (Scorecard Pinned-Dependencies),
          # instead of an unpinned pip command.
          bash tools/deps/install_locked.sh runtime

      - name: Verify node constitution alignment
        run: |
          python scripts/verify_node_constitution.py

  tier2-attestation-tests:
    name: Tier 2 Constitution + Attestation Tests
    runs-on: ubuntu-latest
    needs:
      - constitution-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml

      - name: Install test dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SDK_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          # Locked, hash-verified install from uv.lock (replaces a hand-pinned
          # wheel list that had drifted from the lock: fastapi 0.141.1 and
          # pydantic 2.13.4 against the lock's 0.161.0 and 2.14.1).
          bash tools/deps/install_locked.sh full
      - name: Verify required imports
        run: |
          python - <<'PY'
          import structlog
          print(f"structlog import ok: {structlog.__version__}")
          PY

      - name: Run Tier 2 constitution tests
        run: |
          PYTHONPATH=. pytest tests/contracts/tier2/test_node_constitution_contract.py \
            tests/contracts/tier2/test_runtime_attestation_contract.py \
            -q --disable-warnings --maxfail=1 -o addopts=""

  contract-bound-change-gate:
    name: Contract-Bound Change Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - constitution-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Evaluate contract-bound changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          base_ref = os.environ["BASE_REF"]
          head_ref = os.environ["HEAD_REF"]

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", base_ref, head_ref],
              text=True,
          ).splitlines()

          contract_bound_prefixes = (
              "app/api/v1/",
              "app/agents/",
              "app/engines/",
              "app/services/",
              "chassis/",
          )
          contract_files_prefixes = (
              "docs/contracts/",
              "tests/contracts/",
              "scripts/verify_node_constitution.py",
          )

          touched_bound = [
              path for path in diff if path.startswith(contract_bound_prefixes)
          ]
          touched_contracts = [
              path
              for path in diff
              if path.startswith(contract_files_prefixes)
          ]

          summary_lines = []
          summary_lines.append("## L9 Constitution Review Signal")
          summary_lines.append("")
          summary_lines.append("### Changed files")
          for path in diff:
              summary_lines.append(f"- `{path}`")

          summary_lines.append("")
          summary_lines.append("### Contract-bound surfaces")
          if touched_bound:
              for path in touched_bound:
                  summary_lines.append(f"- `{path}`")
          else:
              summary_lines.append("- none")

          summary_lines.append("")
          summary_lines.append("### Contract/test surfaces")
          if touched_contracts:
              for path in touched_contracts:
                  summary_lines.append(f"- `{path}`")
          else:
              summary_lines.append("- none")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(summary_lines) + "\n")

          if touched_bound and not touched_contracts:
              print(
                  "Contract-bound application files changed without corresponding "
                  "docs/contracts, tests/contracts, or constitution verifier updates.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
