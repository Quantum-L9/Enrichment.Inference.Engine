name: L9 Contract Control

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  constitution-and-attestation:
    name: Constitution + Attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install control dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          # Dependabot exception: GitHub isolates repo Actions secrets from
          # Dependabot pull_request events by design, so SDK_TOKEN will be
          # empty here. Dep-only diffs do not require attestation verification
          # (they touch neither app code nor contracts). Record an auditable
          # skip; the same gate runs against the merge commit on push-to-main.
          if [ -z "${SDK_TOKEN}" ]; then
            if [ "${IS_DEPENDABOT}" = "true" ]; then
              {
                echo "### Constitution + Attestation — Dependabot event skip"
                echo "- Actor: \`${{ github.actor }}\`"
                echo "- Rationale: Dependabot events cannot access \`SDK_TOKEN\`; dep-only diffs do not require attestation. Post-merge push-to-main run preserves the gate."
                echo "- Remediation to eliminate skip: mirror \`SDK_TOKEN\` into the Dependabot secrets store."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "DEPENDABOT_SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "SDK_TOKEN is required to install private SDK dependencies"
            exit 1
          fi
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Verify constitution
        if: env.DEPENDABOT_SKIP != '1'
        run: |
          python scripts/l9_contract_control.py verify-constitution

      - name: Verify attestation
        if: env.DEPENDABOT_SKIP != '1'
        run: |
          # F-029: an attestation that cannot be built is a failure, not a skip.
          python scripts/l9_contract_control.py verify-attestation

  review-signal:
    name: Review Signal
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - constitution-and-attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install review dependencies
        run: |
          python -m pip install pyyaml

      - name: Emit review signal
        # shell: bash runs `bash --noprofile --norc -eo pipefail`; the default
        # `bash -e` lets `review-signal … | tee` swallow a blocking exit (F-030).
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/l9_contract_control.py review-signal --base "$BASE_REF" --head "$HEAD_REF" | tee review_signal.md
          cat review_signal.md >> "$GITHUB_STEP_SUMMARY"

  select-and-run-gates:
    name: Select and Run Gates
    runs-on: ubuntu-latest
    needs:
      - constitution-and-attestation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          if [ -z "${SDK_TOKEN}" ]; then
            echo "SDK_TOKEN is required to install private SDK dependencies"
            exit 1
          fi
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Compute changed files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          FILES="$(git diff --name-only "$BASE" "$HEAD" | tr '\n' ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Select gates
        id: gates
        shell: bash
        run: |
          python scripts/l9_contract_control.py select-gates --files ${{ steps.changed.outputs.files }} > gates.json
          cat gates.json
          echo "json=$(python - <<'PY'
          import json
          print(json.dumps(json.load(open('gates.json'))))
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned native CEG subject
        uses: actions/checkout@v7
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: 93cf1a83bdb88656a627b442a6d114c3a3502cde
          path: .ci-subjects/ceg
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false

      - name: Prepare native CEG validator
        shell: bash
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/.ci-subjects/ceg"
          test "$(git -C "$subject" rev-parse HEAD)" = "93cf1a83bdb88656a627b442a6d114c3a3502cde"
          python -m venv "$RUNNER_TEMP/ceg-native-venv"
          native_python="$RUNNER_TEMP/ceg-native-venv/bin/python"
          "$native_python" -m pip install --require-hashes --no-deps -r "$subject/requirements-runtime.lock"
          # Import/CLI only: no CEG service, graph connection, or approval.
          "$native_python" "$subject/tools/validate_domain.py" --help
          echo "L9_CEG_NATIVE_REPO=$subject" >> "$GITHUB_ENV"
          echo "L9_CEG_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"

      - name: Run selected commands
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess

          payload = json.load(open('gates.json'))
          commands = payload.get('commands', [])
          if not commands:
              print('[l9-control] no matching gates selected')
              raise SystemExit(0)

          seen = set()
          ordered = []
          for command in commands:
              if command not in seen:
                  seen.add(command)
                  ordered.append(command)

          for command in ordered:
              print(f'[l9-control] running: {command}')
              completed = subprocess.run(command, shell=True)
              if completed.returncode != 0:
                  raise SystemExit(completed.returncode)
          PY
