# Universal CI/CD Pack — Documentation Sync Validation
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.0.0
# PURPOSE: Validate documentation links and structure
# SIBLING PARITY: Cognitive.Engine.Graphs/docs-sync.yml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Docs Sync Validation

on:
  pull_request:
    paths:
      - 'readme/**'
      - 'docs/**'
      - '*.md'
  push:
    branches:
      - main
    paths:
      - 'readme/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check Markdown Links
        # Process substitution, not pipes: a `cmd | while read` loop runs in a
        # subshell, so the BROKEN it incremented was discarded and this step
        # could never fail. Links are checked without their #anchor or title.
        run: |
          echo "Checking internal links in documentation..."
          BROKEN=0
          while IFS= read -r file; do
            while IFS= read -r link; do
              case "$link" in
                ./*|../*) ;;
                *) continue ;;
              esac
              path="${link%%#*}"
              path="${path%% *}"
              target="$(dirname "$file")/$path"
              if [ ! -e "$target" ]; then
                echo "  Broken link in $file: $link"
                BROKEN=$((BROKEN + 1))
              fi
            done < <(grep -oP '\[.*?\]\(\K[^)]+' "$file" 2>/dev/null)
          done < <(for dir in readme docs; do if [ -d "$dir" ]; then find "$dir" -name "*.md" -type f; fi; done)

          if [ "$BROKEN" -gt 0 ]; then
            echo "❌ Found $BROKEN broken internal link(s)"
            exit 1
          fi

          echo "✅ All documentation links are valid"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# END OF DOCS SYNC
