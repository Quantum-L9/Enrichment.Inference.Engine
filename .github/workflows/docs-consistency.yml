# Each step checks a file this repository has. A step that SKIPs with exit 0
# when its target is missing proves nothing, and four of them always did:
#   AGENT.md            -> AGENTS.md (the agent contract; "Autonomy Tiers")
#   INVARIANTS.md       -> docs/INVARIANTS.md (INV-1..INV-20, matched whole)
#   GUARDRAILS.md ref   -> retired: no GUARDRAILS.md exists to reference
#   AGENT_BOOTSTRAP.md  -> retired: no such file exists in this repository
# A required file that is missing now FAILs. WARN steps stay advisory.
name: docs-consistency

on:
  pull_request:
    paths:
      - '**.md'
      - '.cursorrules'
      - 'pyproject.toml'
      - 'Makefile'
      - 'Repo.mk'
      - 'tools/**'

permissions:
  contents: read

jobs:
  doc-consistency:
    name: Documentation Consistency Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify AGENTS.md contains Autonomy Tiers
        run: |
          if [ ! -f "AGENTS.md" ]; then
            echo "FAIL: AGENTS.md not found"
            exit 1
          fi
          if ! grep -qE "^#+ .*Autonomy Tiers" AGENTS.md; then
            echo "FAIL: AGENTS.md missing an 'Autonomy Tiers' section"
            exit 1
          fi
          echo "PASS: AGENTS.md contains Autonomy Tiers"

      - name: Verify 7-gate sequence has single SSOT
        run: |
          # The SSOT for agent-check is the Makefile target itself.
          # Multiple docs may reference it — limit is a sanity check, not strict.
          COUNT=$(grep -rl "make agent-check" *.md 2>/dev/null | wc -l || echo "0")
          if [ "$COUNT" -gt 15 ]; then
            echo "FAIL: 'make agent-check' appears in $COUNT markdown files (max 15 allowed)"
            grep -rl "make agent-check" *.md
            exit 1
          fi
          echo "PASS: make agent-check referenced in $COUNT files (within limit)"

      - name: Verify docs/INVARIANTS.md contains INV-1 through INV-20
        run: |
          if [ ! -f "docs/INVARIANTS.md" ]; then
            echo "FAIL: docs/INVARIANTS.md not found"
            exit 1
          fi
          for i in $(seq 1 20); do
            # Whole identifier: INV-1 must not be satisfied by INV-10.
            if ! grep -qE "INV-$i([^0-9]|$)" docs/INVARIANTS.md; then
              echo "FAIL: docs/INVARIANTS.md missing INV-$i"
              exit 1
            fi
          done
          echo "PASS: All INV-1 through INV-20 present in docs/INVARIANTS.md"

      - name: Verify active registered waivers have ADR references
        run: |
          REGISTER="docs/CI_WHITELIST_REGISTER.md"
          if [ ! -f "$REGISTER" ]; then
            echo "FAIL: $REGISTER not found"
            exit 1
          fi
          for waiver in 002 004 005; do
            if ! grep -q "ADR-$waiver" "$REGISTER"; then
              echo "FAIL: $REGISTER missing ADR-$waiver reference for WAIVER-$waiver"
              exit 1
            fi
          done
          echo "PASS: All active registered WAIVER->ADR references present"

      - name: Verify ADR files exist
        run: |
          if [ ! -d "docs/adr" ]; then
            echo "FAIL: docs/adr/ directory not found"
            exit 1
          fi
          for i in $(seq 1 7); do
            NUM=$(printf "%03d" $i)
            if ! ls docs/adr/ADR-${NUM}-*.md 1> /dev/null 2>&1; then
              echo "FAIL: docs/adr/ADR-${NUM}-*.md not found"
              exit 1
            fi
          done
          echo "PASS: All 7 ADR files exist"

      - name: Detect new root-level directories (INV-16 warning)
        run: |
          NEW_DIRS=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '^[^/]+/$' || true)
          if [ -n "$NEW_DIRS" ]; then
            echo "WARN: New root-level directories detected — INV-16 requires arch team approval:"
            echo "$NEW_DIRS"
          else
            echo "PASS: No new root-level directories"
          fi

      - name: Detect ruff ignore list changes (INV-17 warning)
        run: |
          if git diff HEAD~1..HEAD -- pyproject.toml 2>/dev/null | grep -q "^[+-].*ignore.*="; then
            echo "WARN: pyproject.toml ruff ignore list may have changed — INV-17 requires ADR approval"
            git diff HEAD~1..HEAD -- pyproject.toml | grep -E "^[+-].*ignore" || true
          else
            echo "PASS: ruff ignore list unchanged"
          fi

      - name: Verify HTTP route count (INV-1 warning)
        run: |
          if [ -d "app/api" ]; then
            ROUTE_COUNT=$(grep -rE "@(app|router)\.(post|get|put|delete|patch)\(" app/api/ 2>/dev/null | wc -l || echo "0")
            echo "HTTP route decorators found: $ROUTE_COUNT"
            if [ "$ROUTE_COUNT" -gt 4 ]; then
              echo "WARN: More than 4 route decorators found in app/api/ — INV-1 limits to 2 routes"
            else
              echo "PASS: Route count within expected range"
            fi
          else
            echo "SKIP: app/api/ not found"
          fi
