name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-hex revision the deep plan may run
        required: false
        type: string
      utc_slot:
        description: UTC day YYYY-MM-DD
        required: false
        type: string
      deep_contract:
        description: Deep contract name
        required: false
        type: string
      dispatch_key:
        description: Idempotency key for this UTC slot
        required: false
        type: string
      mode:
        description: plan or apply. Empty is a manual CI run, not a deep dispatch
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '71' }}
  TEST_DIR: ${{ vars.TEST_DIR || 'tests/' }}
  SOURCE_DIR: ${{ vars.SOURCE_DIR || 'app' }}

jobs:
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Validation Tools
        # Hash-verified from uv.lock (pyyaml is a runtime dependency).
        run: |
          bash tools/deps/install_locked.sh runtime
      - name: Check Python Syntax
        run: |
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -exec python -m py_compile {} +

      - name: Gate_SDK declares the v1 channel (offline)
        # Covers pyproject.toml ([tool.uv.sources] on tag v1), uv.lock (the
        # resolved commit) and every workflow, Dockerfile and devcontainer, none
        # of which may install the SDK directly — an un-enumerated install site
        # is how a third Gate_SDK sha ran in CI unnoticed.
        run: |
          python scripts/validate_sdk_pin.py

      # The networked lock-vs-channel check runs in `sdk-channel`, so a remote
      # outage cannot fail this offline structural job and starve every job
      # that needs it.
      - name: Validate YAML Files
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import yaml
          errors = []
          for path in Path('.github/workflows').glob('*.yml'):
              try:
                  yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: {exc}')
          for path in Path('kb').glob('*.yaml') if Path('kb').exists() else []:
              try:
                  data = yaml.safe_load(path.read_text())
                  if not isinstance(data, dict):
                      errors.append(f'{path}: not a YAML mapping')
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Linting Tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Run Ruff Linter
        run: ruff check . --output-format=github
      - name: Run Ruff Formatter Check
        run: ruff format --check .
      - name: Run Mypy Type Checker
        run: |
          mypy ${{ env.SOURCE_DIR }} \
            --show-error-codes \
            --pretty \
            --install-types \
            --non-interactive \
            --ignore-missing-imports

  semgrep:
    name: Semgrep Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Semgrep is Core-owned: its version is Quantum-L9/l9-ci-core
      # toolchain-lock.json's, installed hash-locked by Core's installer (on by
      # default). The lock is built for CPython 3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Core toolchain (Semgrep included)
        id: core
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@v2
      - name: Run Semgrep
        env:
          SEMGREP: ${{ steps.core.outputs.semgrep-executable }}
        run: |
          set -euo pipefail
          if [[ -z "${SEMGREP}" ]]; then
            echo "::error::install-consumer-ci@v2 did not install Semgrep (v2 predates Quantum-L9/l9-ci-core#248)"
            exit 1
          fi
          "${SEMGREP}" --config .semgrep/ --error --quiet --metrics=off --disable-version-check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Read pinned CEG revision
        id: ceg_pin
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tests/contracts/ceg_revision.py").read_text(encoding="utf-8")
          found = re.search(r'^CEG_REVISION = "([0-9a-f]{40})"$', text, re.M)
          if found is None:
              raise SystemExit("CEG_REVISION is not one 40-character revision")
          print(found.group(1))
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CEG_SUBJECT_SHA=$sha" >> "$GITHUB_ENV"
      - name: Checkout pinned native CEG subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: ${{ steps.ceg_pin.outputs.sha }}
          path: .ci-subjects/ceg
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Prepare native CEG validator
        shell: bash
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/.ci-subjects/ceg"
          test "$(git -C "$subject" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          python -m venv "$RUNNER_TEMP/ceg-native-venv"
          native_python="$RUNNER_TEMP/ceg-native-venv/bin/python"
          # CEG's own hash-locked runtime profile (uv sync --locked against its
          # uv.lock; uv itself bootstrapped with pip --require-hashes), as its
          # production image installs it (CEG pins nothing outside uv.lock).
          PYTHON="$native_python" bash "$subject/tools/deps/install_locked.sh" runtime
          # Import/CLI only: no CEG service, graph connection, or approval.
          "$native_python" "$subject/tools/validate_domain.py" --help
          echo "L9_CEG_NATIVE_REPO=$subject" >> "$GITHUB_ENV"
          echo "L9_CEG_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
      - name: Run PR-fast tests
        # Codecov upload deferred. The full catalog runs only from the deep
        # plan (`make test-deep`). This one run also records PR-fast coverage
        # of app/ for the SonarCloud job below (Repo.mk PR_FAST_COVERAGE_XML);
        # no second test run is made for Sonar.
        run: make test PR_FAST_COVERAGE_XML=coverage.xml
      - name: Require the PR-fast coverage report
        run: |
          set -euo pipefail
          if [ ! -s coverage.xml ]; then
            echo "::error::make test wrote no coverage.xml; SonarCloud would read 0% coverage" >&2
            exit 1
          fi
      - name: Upload PR-fast coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-pr-fast
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3

  # SonarCloud analysis. It reads the coverage the Test Suite job above
  # measured, so it runs after it in this workflow (it was a separate
  # workflow with no test run and imported 0% coverage). It stays outside
  # ci-gate's needs: Sonar is not a required check. Same events as before:
  # push to main and same-repository pull requests; not workflow_dispatch.
  sonar:
    name: SonarCloud
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deep plan only. Not in ci-gate's needs and not a pull_request or push job.
  # One workflow_dispatch with mode=apply runs this job: full catalog once,
  # tests/integration once under EIE_REQUIRE_INTEGRATION, then the converge
  # e2e. mode=plan and a manual dispatch with no mode run zero heavy steps.
  # A missing Redis, Neo4j, or pinned peer fails the job (NOT_RUN). Durable
  # slot admission is the Core scheduler's ledger; this job only refuses a
  # malformed dispatch and will not overlap another run of the same slot key.
  deep-admit:
    name: Deep dispatch admission
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_heavy: ${{ steps.admit.outputs.run_heavy }}
    permissions:
      contents: read
    steps:
      - name: Admit deep dispatch before any install
        id: admit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          UTC_SLOT: ${{ inputs.utc_slot }}
          DEEP_CONTRACT: ${{ inputs.deep_contract }}
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
          DEEP_MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode="${DEEP_MODE:-}"
          if [ -z "$mode" ]; then
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch without mode is manual CI; no deep plan"
            exit 0
          fi
          if [ "${GITHUB_REPOSITORY:-}" != "Quantum-L9/Enrichment.Inference.Engine" ]; then
            echo "NOT_RUN: repository is ${GITHUB_REPOSITORY:-unknown}"
            exit 1
          fi
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "NOT_RUN: default branch is unknown"
            exit 1
          fi
          if [ "${GITHUB_REF:-}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "NOT_RUN: ref ${GITHUB_REF:-unknown} is not refs/heads/${DEFAULT_BRANCH}"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_SHA:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "NOT_RUN: expected_sha is not 40 lowercase hex"
            exit 1
          fi
          if [ "${GITHUB_SHA:-}" != "${EXPECTED_SHA}" ]; then
            echo "NOT_RUN: HEAD ${GITHUB_SHA:-unknown} does not match expected_sha"
            exit 1
          fi
          if ! printf '%s' "${UTC_SLOT:-}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "NOT_RUN: utc_slot is not YYYY-MM-DD"
            exit 1
          fi
          if ! python3 -c 'import datetime,sys; datetime.date.fromisoformat(sys.argv[1])' "${UTC_SLOT}"; then
            echo "NOT_RUN: utc_slot is not a calendar date"
            exit 1
          fi
          if ! printf '%s' "${DEEP_CONTRACT:-}" | grep -Eq '^[A-Za-z0-9._:/-]{1,200}$'; then
            echo "NOT_RUN: deep_contract is empty or not a bounded name"
            exit 1
          fi
          if ! printf '%s' "${DISPATCH_KEY:-}" | grep -Eq '^[A-Za-z0-9._:-]{8,200}$'; then
            echo "NOT_RUN: dispatch_key is empty or not a bounded token"
            exit 1
          fi
          if [ "$mode" = "plan" ]; then
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
            echo "plan: zero heavy jobs for ${UTC_SLOT} ${DISPATCH_KEY}"
            exit 0
          fi
          if [ "$mode" != "apply" ]; then
            echo "NOT_RUN: mode must be plan or apply"
            exit 1
          fi
          echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          echo "apply: ${UTC_SLOT} ${DEEP_CONTRACT} ${DISPATCH_KEY}"

  integration:
    name: Integration Tests (Redis + Neo4j Enterprise + Gate/CEG peers)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [validate, deep-admit]
    if: ${{ always() && needs.validate.result == 'success' && needs.deep-admit.result == 'success' && needs.deep-admit.outputs.run_heavy == 'true' }}
    concurrency:
      group: eie-deep-${{ inputs.utc_slot }}-${{ inputs.dispatch_key }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      # Gate peer, pinned. The CEG peer is tests/contracts/ceg_revision.py,
      # read in the step below; the checkout verifies HEAD.
      GATE_SUBJECT_SHA: b451b68b98b315f57f0c4f9b99090a437e9dac23
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        # Enterprise: the seam test creates one database per disposable tenant
        # (CREATE DATABASE), which Community rejects. Evaluation licence
        # accepted for CI, as Cognitive.Engine.Graphs' integration job does.
        image: neo4j:5.18-enterprise@sha256:745cfda6713a7fa14f763d0730f464fd5b16afaccf5328ff9b4c5785c87b5f37
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
          NEO4J_AUTH: neo4j/l9-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p l9-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Read pinned CEG revision
        id: ceg_pin
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tests/contracts/ceg_revision.py").read_text(encoding="utf-8")
          found = re.search(r'^CEG_REVISION = "([0-9a-f]{40})"$', text, re.M)
          if found is None:
              raise SystemExit("CEG_REVISION is not one 40-character revision")
          print(found.group(1))
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CEG_SUBJECT_SHA=$sha" >> "$GITHUB_ENV"
      - name: Checkout pinned Cognitive.Engine.Graphs peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: ${{ steps.ceg_pin.outputs.sha }}
          path: .ci-subjects/ceg-peer
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Checkout pinned Constellation.Gate peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quantum-L9/Constellation.Gate
          ref: ${{ env.GATE_SUBJECT_SHA }}
          path: .ci-subjects/gate-peer
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Require Redis, Neo4j, and pinned peers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket
          import sys

          def check(host, port, label):
              try:
                  with socket.create_connection((host, port), timeout=5):
                      return
              except OSError as exc:
                  sys.exit(
                      f"NOT_RUN: {label} is not accepting connections at {host}:{port} ({exc})"
                  )

          check("127.0.0.1", 6379, "Redis")
          check("127.0.0.1", 7687, "Neo4j")
          PY
          ceg="$GITHUB_WORKSPACE/.ci-subjects/ceg-peer"
          gate="$GITHUB_WORKSPACE/.ci-subjects/gate-peer"
          if [ ! -d "$ceg" ]; then
            echo "NOT_RUN: pinned CEG peer is missing"
            exit 1
          fi
          if [ ! -d "$gate/constellation-gate" ]; then
            echo "NOT_RUN: pinned Gate peer is missing"
            exit 1
          fi
          test "$(git -C "$ceg" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          test "$(git -C "$gate" rev-parse HEAD)" = "$GATE_SUBJECT_SHA"
      - name: Build EIE virtualenv (.venv)
        # The seam harness and the cross-engine proof launch EIE from
        # <root>/.venv/bin/python, so EIE installs into a real .venv here.
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m venv .venv
          PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" bash tools/deps/install_locked.sh full
          git config --global --remove-section "url.https://x-access-token:${SDK_TOKEN}@github.com/"
          .venv/bin/python -c "import app, pathlib; assert pathlib.Path(app.__file__).is_relative_to(pathlib.Path.cwd())"
      - name: Build peer virtualenvs
        shell: bash
        run: |
          set -euo pipefail
          ceg="$GITHUB_WORKSPACE/.ci-subjects/ceg-peer"
          gate="$GITHUB_WORKSPACE/.ci-subjects/gate-peer"
          test "$(git -C "$ceg" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          test "$(git -C "$gate" rev-parse HEAD)" = "$GATE_SUBJECT_SHA"
          # CEG: its own hash-locked runtime profile, as its production image installs it.
          python -m venv "$ceg/.venv"
          PATH="$ceg/.venv/bin:$PATH" bash "$ceg/tools/deps/install_locked.sh" runtime
          (cd "$ceg" && .venv/bin/python -c "import chassis.entrypoint, engine.graph.driver, uvicorn")
          # Gate: its hash-locked requirements, then the package itself (src layout).
          python -m venv "$gate/.venv"
          "$gate/.venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$gate/constellation-gate/requirements.lock"
          "$gate/.venv/bin/python" -m pip install --disable-pip-version-check --no-deps -e "$gate/constellation-gate"
          "$gate/.venv/bin/python" -c "import constellation_gate.api.main, uvicorn"
      - name: Run the full catalog once
        env:
          TESTING: "true"
          L9_CEG_NATIVE_REPO: ${{ github.workspace }}/.ci-subjects/ceg-peer
          L9_CEG_NATIVE_PYTHON: ${{ github.workspace }}/.ci-subjects/ceg-peer/.venv/bin/python
        run: |
          mapfile -t QUARANTINE_DESELECTS < <(.venv/bin/python tools/pytest_quarantine_deselects.py)
          echo "Deselecting ${#QUARANTINE_DESELECTS[@]} quarantined tests from baseline ledger"
          PYTHONPATH=. .venv/bin/python -m pytest tests/ \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            -n auto \
            "${QUARANTINE_DESELECTS[@]}" \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --timeout=300 \
            --tb=short \
            -q
      - name: Run Integration Tests
        env:
          EIE_REQUIRE_INTEGRATION: '1'
          TESTING: "true"
          # test_redis_idempotency_tenant_isolation.py
          REDIS_URL: redis://localhost:6379/0
          # tests/integration/conftest.py neo4j_container
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: l9-test-password
          # test_observed_relationship_producer.py (Constellation.Gate seam harness)
          L9_SEAM_NEO4J_URI: bolt://127.0.0.1:7687
          L9_SEAM_NEO4J_USER: neo4j
          L9_SEAM_NEO4J_PASSWORD: l9-test-password
          L9_SEAM_EIE_ROOT: ${{ github.workspace }}
          L9_SEAM_CEG_ROOT: ${{ github.workspace }}/.ci-subjects/ceg-peer
          L9_SEAM_GATE_ROOT: ${{ github.workspace }}/.ci-subjects/gate-peer/constellation-gate
          L9_SEAM_GATE_PYTHON: ${{ github.workspace }}/.ci-subjects/gate-peer/.venv/bin/python
          # test_cross_engine_native_release.py
          CEG_REPO: ${{ github.workspace }}/.ci-subjects/ceg-peer
          CEG_PYTHON: ${{ github.workspace }}/.ci-subjects/ceg-peer/.venv/bin/python
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/integration \
            -p no:xdist \
            --timeout=300 \
            --tb=short \
            -rfEs \
            -v
      - name: Build Gate and EIE images from their own Dockerfiles
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/.ci-subjects/gate-peer"
          test "$(git -C "$gate" rev-parse HEAD)" = "$GATE_SUBJECT_SHA"
          docker build -t l9e2e/gate:local "$gate/constellation-gate"
          docker build -t l9e2e/eie:local .
      - name: Run converge e2e
        env:
          L9_E2E_GATE_RAIL: ${{ github.workspace }}/.ci-subjects/gate-peer/constellation-gate/tests/e2e/docker
          L9_E2E_STATE_DIR: ${{ runner.temp }}/l9e2e
        run: bash tests/e2e/run_converge_e2e.sh

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Security Tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Install gitleaks (binary — no org license required)
        # Version and SHA-256 are the pin Quantum-L9/l9-ci-core selects
        # (.github/actions/install-consumer-ci/tool-ownership.json,
        # .github/workflows/security.yml); gitleaks.yml uses the same pair.
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --tlsv1.2 -sSfL "$url" -o gitleaks.tar.gz
          actual_sha="$(sha256sum gitleaks.tar.gz | awk '{print $1}')"
          if [ "${actual_sha}" != "${GITLEAKS_SHA256}" ]; then
            echo "::error::gitleaks checksum mismatch: got ${actual_sha}"
            exit 1
          fi
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

      - name: Run pip-audit
        run: pip-audit --desc
      - name: Run Bandit
        run: |
          bandit -r ${{ env.SOURCE_DIR }} \
            -ll \
            -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || echo "Bandit warnings are non-blocking"
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate Software Bill of Materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Private repository: Scorecard's GraphQL/REST checks (Branch-Protection,
    # Code-Review, CI-Tests) read issues, pull requests and check runs. Without
    # them main failed with "ListCommits ... githubv4.Query: Resource not
    # accessible by integration" (run 42026824470). These are the
    # scorecard-action README's recommended reads for private repos; the two
    # writes are its publish_results requirements, held on this job only.
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: scorecard.sarif

  sdk-channel:
    name: Gate_SDK Channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Gate_SDK lock agrees with the v1 channel (networked)
        # The offline check in `validate` cannot see a stale lock: `v1` moves
        # inside Gate_SDK and nothing here changes. This resolves the channel
        # at the canonical remote and fails closed when the lock no longer
        # matches or the remote cannot be resolved. No `needs`, and nothing
        # needs it but ci-gate: a moved tag or an outage fails this job and the
        # gate without starving the test signal (Cognitive.Engine.Graphs #412).
        run: |
          python scripts/validate_sdk_pin.py --verify-tag
      - name: Install uv (hash-pinned)
        run: bash tools/deps/install_locked.sh uv
      - name: uv.lock agrees with pyproject.toml (networked)
        # `--check` re-resolves without writing and fails if uv.lock would
        # change: a pyproject edit without `uv lock`, or a lock edited by hand.
        run: python -m uv lock --check

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - validate
      - sdk-channel
      - lint
      - semgrep
      - test
      - security
      - sbom
      - scorecard
    permissions:
      contents: read
    steps:
      - name: Evaluate All Results
        # Every job above is required and none has an event exclusion: all
        # run on push, pull_request and workflow_dispatch. So each must
        # conclude `success`; failure, cancelled or an unexpected skip fails
        # the gate. sbom and scorecard used to be printed only, and a
        # cancelled job passed. Results arrive through the environment, never
        # interpolated into the script.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          print("CI Pipeline Results")
          bad = []
          for job, data in sorted(needs.items()):
              result = data.get("result")
              print(f"  {job:12} {result}")
              if result != "success":
                  bad.append(f"{job}={result}")
          if not needs or bad:
              print("CI gate failed: " + (", ".join(bad) or "no job results"))
              sys.exit(1)
          print("CI gate passed")
          PY
