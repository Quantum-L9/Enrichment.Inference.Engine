name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '71' }}
  TEST_DIR: ${{ vars.TEST_DIR || 'tests/' }}
  SOURCE_DIR: ${{ vars.SOURCE_DIR || 'app' }}

jobs:
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Validation Tools
        # Hash-verified from uv.lock (pyyaml is a runtime dependency).
        run: |
          bash tools/deps/install_locked.sh runtime
      - name: Check Python Syntax
        run: |
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -exec python -m py_compile {} +

      - name: Gate_SDK declares the v1 channel (offline)
        # Covers pyproject.toml ([tool.uv.sources] on tag v1), uv.lock (the
        # resolved commit) and every workflow, Dockerfile and devcontainer, none
        # of which may install the SDK directly — an un-enumerated install site
        # is how a third Gate_SDK sha ran in CI unnoticed.
        run: |
          python scripts/validate_sdk_pin.py

      # The networked lock-vs-channel check runs in `sdk-channel`, so a remote
      # outage cannot fail this offline structural job and starve every job
      # that needs it.
      - name: Validate YAML Files
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import yaml
          errors = []
          for path in Path('.github/workflows').glob('*.yml'):
              try:
                  yaml.safe_load(path.read_text())
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: {exc}')
          for path in Path('kb').glob('*.yaml') if Path('kb').exists() else []:
              try:
                  data = yaml.safe_load(path.read_text())
                  if not isinstance(data, dict):
                      errors.append(f'{path}: not a YAML mapping')
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Linting Tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Run Ruff Linter
        run: ruff check . --output-format=github
      - name: Run Ruff Formatter Check
        run: ruff format --check .
      - name: Run Mypy Type Checker
        run: |
          mypy ${{ env.SOURCE_DIR }} \
            --show-error-codes \
            --pretty \
            --install-types \
            --non-interactive \
            --ignore-missing-imports

  semgrep:
    name: Semgrep Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep --config .semgrep/ --error --quiet

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Install Dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Checkout pinned native CEG subject
        uses: actions/checkout@v7
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: 93cf1a83bdb88656a627b442a6d114c3a3502cde
          path: .ci-subjects/ceg
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Prepare native CEG validator
        shell: bash
        run: |
          set -euo pipefail
          subject="$GITHUB_WORKSPACE/.ci-subjects/ceg"
          test "$(git -C "$subject" rev-parse HEAD)" = "93cf1a83bdb88656a627b442a6d114c3a3502cde"
          python -m venv "$RUNNER_TEMP/ceg-native-venv"
          native_python="$RUNNER_TEMP/ceg-native-venv/bin/python"
          "$native_python" -m pip install --require-hashes --no-deps -r "$subject/requirements-runtime.lock"
          # Import/CLI only: no CEG service, graph connection, or approval.
          "$native_python" "$subject/tools/validate_domain.py" --help
          echo "L9_CEG_NATIVE_REPO=$subject" >> "$GITHUB_ENV"
          echo "L9_CEG_NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"
      - name: Run Tests with Coverage
        env:
          TESTING: "true"
        run: |
          mapfile -t QUARANTINE_DESELECTS < <(python tools/pytest_quarantine_deselects.py)
          echo "Deselecting ${#QUARANTINE_DESELECTS[@]} quarantined tests from baseline ledger"
          PYTHONPATH=. pytest ${{ env.TEST_DIR }} \
            -n auto \
            "${QUARANTINE_DESELECTS[@]}" \
            --cov=${{ env.SOURCE_DIR }} \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --timeout=300 \
            --tb=short \
            -v
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # Advisory: not in ci-gate's needs and not a required check. It supplies every
  # environment condition tests/integration skips on — Redis, Neo4j Enterprise,
  # and pinned Cognitive.Engine.Graphs / Constellation.Gate checkouts with their
  # own virtualenvs — and sets EIE_REQUIRE_INTEGRATION=1, under which
  # tests/conftest.py turns any integration skip into a failure. Without the
  # flag (the `test` jobs, local runs) skips are unchanged.
  integration:
    name: Integration Tests (Redis + Neo4j Enterprise + Gate/CEG peers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: validate
    permissions:
      contents: read
    env:
      # Peer subjects, pinned. Bump deliberately; each step verifies HEAD.
      CEG_SUBJECT_SHA: 3379309971f9defa40c393b2292f2f1784aa90ac
      GATE_SUBJECT_SHA: ab8fb674e65f2cafe4172178c1ce6de18b4bb0f4
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        # Enterprise: the seam test creates one database per disposable tenant
        # (CREATE DATABASE), which Community rejects. Evaluation licence
        # accepted for CI, as Cognitive.Engine.Graphs' integration job does.
        image: neo4j:5.18-enterprise@sha256:745cfda6713a7fa14f763d0730f464fd5b16afaccf5328ff9b4c5785c87b5f37
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
          NEO4J_AUTH: neo4j/l9-test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p l9-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            uv.lock
            pyproject.toml
      - name: Checkout pinned Cognitive.Engine.Graphs peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quantum-L9/Cognitive.Engine.Graphs
          ref: ${{ env.CEG_SUBJECT_SHA }}
          path: .ci-subjects/ceg-peer
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Checkout pinned Constellation.Gate peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quantum-L9/Constellation.Gate
          ref: ${{ env.GATE_SUBJECT_SHA }}
          path: .ci-subjects/gate-peer
          token: ${{ secrets.SDK_TOKEN }}
          persist-credentials: false
      - name: Build EIE virtualenv (.venv)
        # The seam harness and the cross-engine proof launch EIE from
        # <root>/.venv/bin/python, so EIE installs into a real .venv here.
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m venv .venv
          PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" bash tools/deps/install_locked.sh full
          git config --global --remove-section "url.https://x-access-token:${SDK_TOKEN}@github.com/"
          .venv/bin/python -c "import app, pathlib; assert pathlib.Path(app.__file__).is_relative_to(pathlib.Path.cwd())"
      - name: Build peer virtualenvs
        shell: bash
        run: |
          set -euo pipefail
          ceg="$GITHUB_WORKSPACE/.ci-subjects/ceg-peer"
          gate="$GITHUB_WORKSPACE/.ci-subjects/gate-peer"
          test "$(git -C "$ceg" rev-parse HEAD)" = "$CEG_SUBJECT_SHA"
          test "$(git -C "$gate" rev-parse HEAD)" = "$GATE_SUBJECT_SHA"
          # CEG: its own hash-locked runtime profile, as its production image installs it.
          python -m venv "$ceg/.venv"
          PATH="$ceg/.venv/bin:$PATH" bash "$ceg/tools/deps/install_locked.sh" runtime
          (cd "$ceg" && .venv/bin/python -c "import chassis.entrypoint, engine.graph.driver, uvicorn")
          # Gate: its hash-locked requirements, then the package itself (src layout).
          python -m venv "$gate/.venv"
          "$gate/.venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$gate/constellation-gate/requirements.lock"
          "$gate/.venv/bin/python" -m pip install --disable-pip-version-check --no-deps -e "$gate/constellation-gate"
          "$gate/.venv/bin/python" -c "import constellation_gate.api.main, uvicorn"
      - name: Run Integration Tests
        env:
          EIE_REQUIRE_INTEGRATION: '1'
          TESTING: "true"
          # test_redis_idempotency_tenant_isolation.py
          REDIS_URL: redis://localhost:6379/0
          # tests/integration/conftest.py neo4j_container
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: l9-test-password
          # test_observed_relationship_producer.py (Constellation.Gate seam harness)
          L9_SEAM_NEO4J_URI: bolt://127.0.0.1:7687
          L9_SEAM_NEO4J_USER: neo4j
          L9_SEAM_NEO4J_PASSWORD: l9-test-password
          L9_SEAM_EIE_ROOT: ${{ github.workspace }}
          L9_SEAM_CEG_ROOT: ${{ github.workspace }}/.ci-subjects/ceg-peer
          L9_SEAM_GATE_ROOT: ${{ github.workspace }}/.ci-subjects/gate-peer/constellation-gate
          L9_SEAM_GATE_PYTHON: ${{ github.workspace }}/.ci-subjects/gate-peer/.venv/bin/python
          # test_cross_engine_native_release.py
          CEG_REPO: ${{ github.workspace }}/.ci-subjects/ceg-peer
          CEG_PYTHON: ${{ github.workspace }}/.ci-subjects/ceg-peer/.venv/bin/python
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/integration \
            -p no:xdist \
            --timeout=300 \
            --tb=short \
            -rfEs \
            -v

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Security Tools
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full
      - name: Install gitleaks (binary — no org license required)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto "=https" --tlsv1.2 -sSfL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1

      - name: Run pip-audit
        run: pip-audit --desc
      - name: Run Bandit
        run: |
          bandit -r ${{ env.SOURCE_DIR }} \
            -ll \
            -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || echo "Bandit warnings are non-blocking"
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Generate Software Bill of Materials
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Private repository: Scorecard's GraphQL/REST checks (Branch-Protection,
    # Code-Review, CI-Tests) read issues, pull requests and check runs. Without
    # them main failed with "ListCommits ... githubv4.Query: Resource not
    # accessible by integration" (run 42026824470). These are the
    # scorecard-action README's recommended reads for private repos; the two
    # writes are its publish_results requirements, held on this job only.
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif

  sdk-channel:
    name: Gate_SDK Channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Gate_SDK lock agrees with the v1 channel (networked)
        # The offline check in `validate` cannot see a stale lock: `v1` moves
        # inside Gate_SDK and nothing here changes. This resolves the channel
        # at the canonical remote and fails closed when the lock no longer
        # matches or the remote cannot be resolved. No `needs`, and nothing
        # needs it but ci-gate: a moved tag or an outage fails this job and the
        # gate without starving the test signal (Cognitive.Engine.Graphs #412).
        run: |
          python scripts/validate_sdk_pin.py --verify-tag
      - name: Install uv (hash-pinned)
        run: bash tools/deps/install_locked.sh uv
      - name: uv.lock agrees with pyproject.toml (networked)
        # `--check` re-resolves without writing and fails if uv.lock would
        # change: a pyproject edit without `uv lock`, or a lock edited by hand.
        run: python -m uv lock --check

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - validate
      - sdk-channel
      - lint
      - semgrep
      - test
      - security
      - sbom
      - scorecard
    permissions:
      contents: read
    steps:
      - name: Evaluate All Results
        # Every job above is required and none has an event exclusion: all
        # run on push, pull_request and workflow_dispatch. So each must
        # conclude `success`; failure, cancelled or an unexpected skip fails
        # the gate. sbom and scorecard used to be printed only, and a
        # cancelled job passed. Results arrive through the environment, never
        # interpolated into the script.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          print("CI Pipeline Results")
          bad = []
          for job, data in sorted(needs.items()):
              result = data.get("result")
              print(f"  {job:12} {result}")
              if result != "success":
                  bad.append(f"{job}={result}")
          if not needs or bad:
              print("CI gate failed: " + (", ".join(bad) or "no job results"))
              sys.exit(1)
          print("CI gate passed")
          PY
