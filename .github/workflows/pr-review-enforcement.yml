# Universal CI/CD Pack — PR Review Policy Enforcement
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.0.0
# PURPOSE: Advisory PR size report (housekeeping: reports, never blocks)
# SIBLING PARITY: Cognitive.Engine.Graphs/pr-review-enforcement.yml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: PR Review Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  PR_WARN_LINES: ${{ vars.PR_WARN_LINES || '300' }}
  PR_BLOCK_LINES: ${{ vars.PR_BLOCK_LINES || '1000' }}
  PR_MAX_FILES: ${{ vars.PR_MAX_FILES || '50' }}

jobs:
  pr-size-check:
    name: PR Size & Review Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check PR Size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;
            const changedFiles = pr.changed_files || 0;

            const warnThreshold = parseInt('${{ env.PR_WARN_LINES }}');
            const blockThreshold = parseInt('${{ env.PR_BLOCK_LINES }}');
            const maxFiles = parseInt('${{ env.PR_MAX_FILES }}');

            let messages = [];
            // Housekeeping: advisory only (operator decision 2026-11-20). Over-limit
            // PRs are reported and annotated; this check never blocks a merge.
            let overLimit = false;
            let shouldWarn = false;

            messages.push(`## PR Size Report`);
            messages.push('');
            messages.push(`| Metric | Value | Limit |`);
            messages.push(`|--------|-------|-------|`);
            messages.push(`| Lines changed | ${totalChanges} | ${blockThreshold} |`);
            messages.push(`| Files changed | ${changedFiles} | ${maxFiles} |`);
            messages.push(`| Additions | +${additions} | - |`);
            messages.push(`| Deletions | -${deletions} | - |`);
            messages.push('');

            if (totalChanges > blockThreshold) {
              overLimit = true;
              messages.push(`> **Over limit (advisory)**: PR exceeds ${blockThreshold} lines changed`);
              messages.push('');
            } else if (totalChanges > warnThreshold) {
              shouldWarn = true;
              messages.push(`> **WARNING**: PR exceeds ${warnThreshold} lines — consider splitting`);
              messages.push('');
            }

            if (changedFiles > maxFiles) {
              overLimit = true;
              messages.push(`> **Over limit (advisory)**: PR changes ${changedFiles} files (limit: ${maxFiles})`);
              messages.push('');
            }

            if (overLimit || shouldWarn) {
              messages.push('### Best Practices for Large Changes');
              messages.push('');
              messages.push('1. **Refactoring + Features**: Separate into 2 PRs');
              messages.push('2. **Multiple Features**: One PR per feature');
              messages.push('3. **Database + Code**: Separate migration from logic');
              messages.push('4. **Generated Code**: Separate from manual changes');
              messages.push('');
            }

            if (overLimit) {
              messages.push('---');
              messages.push('');
              messages.push('**Advisory:** this PR is over the size limits. This check reports size and never blocks merging.');
            } else if (!shouldWarn) {
              messages.push('✅ **PR size is within recommended limits**');
            }

            const body = messages.join('\n');

            if (overLimit) {
              core.warning('Advisory: PR exceeds size limits — consider splitting this PR (this check does not block)');
            }

            // Publishing the report is best-effort: on fork PRs the token is
            // read-only, and a comment API error must not fail an advisory check.
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.data.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('PR Size Report')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: body
                });
              }
            } catch (error) {
              core.warning(`PR size report comment not published (advisory): ${error.message}`);
            }

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# END OF PR REVIEW ENFORCEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
