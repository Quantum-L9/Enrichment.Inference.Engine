# DORA META: Refactoring Safety Gate (BLOCKING)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PURPOSE: HARD GATE for refactoring PRs — ruff and mypy block
# DEPENDENCIES: Ruff, Mypy
# DEPLOYMENT: Runs on refactor/* branches only
# DORA METRICS: Lint and types block on this gate
# The full catalog is not this pull-request or push job. ci.yml's deep plan
# owns it (`make test-deep`, step "Run the full catalog once"). A missing
# database, peer, or Gate checkout is NOT_RUN or a failure inside that plan.
# SIBLING PARITY: Cognitive.Engine.Graphs/refactoring-validation.yml
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Refactoring Safety Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.py'
  push:
    branches:
      - 'refactor/**'
  workflow_dispatch:

concurrency:
  group: refactor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  SOURCE_DIR: ${{ vars.SOURCE_DIR || 'app' }}

jobs:
  refactor-gate:
    name: Refactoring Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.head_ref, 'refactor/') || startsWith(github.ref, 'refs/heads/refactor/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        env:
          SDK_TOKEN: ${{ secrets.SDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SDK_TOKEN}@github.com/".insteadOf "https://github.com/"
          bash tools/deps/install_locked.sh full

      - name: Run Ruff Linter (BLOCKING)
        run: |
          ruff check . --output-format=github

      - name: Run Ruff Formatter Check (BLOCKING)
        run: |
          ruff format --check .

      - name: Run Mypy Type Checker (BLOCKING)
        run: |
          mypy ${{ env.SOURCE_DIR }}/ --show-error-codes --pretty --ignore-missing-imports

      - name: Refactoring Gate Passed
        run: |
          echo "Ruff and mypy passed"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# END OF REFACTORING VALIDATION
