[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=68
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow-running tests (> 1 second)
    enforcement: Tier-2 contract enforcement tests
    authority: Tier-2 authority-boundary contract tests
    provenance: Tier-2 provenance contract tests
    replay: Tier-2 replay/idempotency contract tests
    failure: Tier-2 dependency-failure contract tests
    degraded: Tier-2 degraded-mode contract tests
