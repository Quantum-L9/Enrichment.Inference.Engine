[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
# Coverage is NOT configured here. The 71% floor (C-15) lives in .coveragerc
# [report] fail_under, which applies to any run that produces a coverage report.
#
# Baking --cov-fail-under into addopts instead applied it to EVERY invocation,
# including subsets that cannot reach a whole-app floor: make test-unit (176
# passing), test-compliance (37), test-ci (17), test-contracts (7) and
# test-integration all failed on coverage alone with zero failing tests, and so
# did make agent-check, which runs two of them as gates 4/8 and 5/8. CI worked
# around this file on its own subset runs with `-o addopts=""`
# (l9-constitution-gate.yml, pr-pipeline.yml Tier 2) — the workaround is the
# evidence that the placement was wrong.
#
# A subset run passes no --cov, so it produces no report and no floor applies.
# Every whole-suite run does pass --cov and is therefore floored by .coveragerc,
# and ci.yml, pr-pipeline.yml, sonarcloud.yml and refactoring-validation.yml
# also pass --cov-fail-under explicitly. Do not move the threshold back here:
# it cannot distinguish a subset from the whole suite.
addopts =
    --verbose
    --strict-markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow-running tests (> 1 second)
    enforcement: Tier-2 contract enforcement tests
    authority: Tier-2 authority-boundary contract tests
    provenance: Tier-2 provenance contract tests
    replay: Tier-2 replay/idempotency contract tests
    failure: Tier-2 dependency-failure contract tests
    degraded: Tier-2 degraded-mode contract tests
