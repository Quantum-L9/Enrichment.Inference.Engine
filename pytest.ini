[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts =
    --verbose
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=60
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow-running tests (> 1 second)
    enforcement: Tier-2 constitution / contract enforcement tests
    authority: Authority and ownership contract tests
    provenance: Provenance / attestation contract tests
    replay: Replay and idempotency contract tests
    failure: Dependency-failure / fail-path enforcement tests
    degraded: Degraded-mode (partial dependency availability) tests
