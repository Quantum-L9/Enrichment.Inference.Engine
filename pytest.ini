[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
# Coverage is NOT configured here. The 71% floor is a whole-suite property, so
# baking --cov-fail-under into addopts made every subset invocation fail on a
# floor it cannot reach (make test-unit / test-compliance / test-ci /
# test-contracts / test-integration, and therefore make agent-check). CI already
# passes the coverage flags explicitly on every full-suite run (ci.yml,
# pr-pipeline.yml, sonarcloud.yml, refactoring-validation.yml) and neutralises
# addopts with `-o addopts=""` on its subset runs — so the floor is owned by the
# invocation, not by this file. `make test-all` passes them explicitly too.
addopts =
    --verbose
    --strict-markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow-running tests (> 1 second)
    enforcement: Tier-2 contract enforcement tests
    authority: Tier-2 authority-boundary contract tests
    provenance: Tier-2 provenance contract tests
    replay: Tier-2 replay/idempotency contract tests
    failure: Tier-2 dependency-failure contract tests
    degraded: Tier-2 degraded-mode contract tests
