# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [governance]
# tags: [L9_TEMPLATE, precommit]
# owner: platform
# status: active
# --- /L9_META ---
#
# Pre-commit hooks — mechanical enforcement before commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Sibling parity: Cognitive.Engine.Graphs/.pre-commit-config.yaml

repos:
  # ── Basic file checks ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        exclude: >
          (?x)^(
            \.github/.*\.yml|
            infra/k8s/helm/.*\.yaml
          )$
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── Code formatting ──────────────────────────────────────────────────
  # ruff and mypy are Core-owned (Quantum-L9/l9-ci-core installer pins,
  # installed by tools/deps/install_locked.sh full): local system hooks run
  # the installed tools, so no hook rev repeats a version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(Current Work/|LEAD ENRICHMENT|Enrichment-Deployment-pack/|"LEAD ENRICHMENT)
      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(Current Work/|LEAD ENRICHMENT|Enrichment-Deployment-pack/)

  # ── Secrets scanning ─────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: 107a41827bb6698dbbff756b2300537774a1d84c  # v8.24.3 (Core toolchain lock)
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  # ── Type checking ────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The command the required CI job runs (ci.yml "Run Mypy Type Checker"),
        # over the package as a whole, in the environment
        # tools/deps/install_locked.sh full builds: the hook and the merge gate
        # are one check against the same packages and stubs.
        entry: mypy app --show-error-codes --ignore-missing-imports
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

  # ── Unit tests (fast subset for pre-commit) ─────────────────────────
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        # Local protection stays the unit marker over every test path under
        # tests/. The selection is literal so the Core PR test-expense judge can
        # read it (a shell wrapper, or a bare tests/, is "no literal entry"):
        # args lists each tests/ child that holds test files, and
        # tests/unit/test_eie_native_hyg_precommit_entry.py fails when one is
        # missing, so a new directory cannot silently drop out. No workflow runs
        # pre-commit (guarded by the same test), so this never starts a second
        # catalog under Actions. No `|| true`: a failing unit test fails the hook.
        entry: python3 -m pytest -m unit --tb=short -q
        args:
          - tests/architecture
          - tests/ci
          - tests/compliance
          - tests/contracts
          - tests/e2e
          - tests/engines
          - tests/eval
          - tests/integration
          - tests/services
          - tests/unit
          - tests/test_agents.py
          - tests/test_api.py
          - tests/test_consensus_engine.py
          - tests/test_convergence_controller.py
          - tests/test_cost_tracker.py
          - tests/test_crm_clients.py
          - tests/test_crm_field_scanner.py
          - tests/test_crm_integration.py
          - tests/test_crm_writeback_orchestrator.py
          - tests/test_discover_scan_endpoints.py
          - tests/test_enrichment_orchestrator.py
          - tests/test_enrichment_profile.py
          - tests/test_enrichment_sources.py
          - tests/test_field_classifier.py
          - tests/test_field_confidence.py
          - tests/test_field_evidence_response_v2.py
          - tests/test_grade_engine.py
          - tests/test_inference_bridge_adapter.py
          - tests/test_kb_resolver.py
          - tests/test_loop_schemas.py
          - tests/test_loop_state.py
          - tests/test_meta_prompt_planner.py
          - tests/test_pass_telemetry.py
          - tests/test_pplx_research.py
          - tests/test_pr20_import_fix.py
          - tests/test_pr21_packet_router.py
          - tests/test_pr21_persistence.py
          - tests/test_pr22_converge_endpoint.py
          - tests/test_pr22_fields_endpoint.py
          - tests/test_rate_limiter.py
          - tests/test_rule_engine.py
          - tests/test_rule_loader.py
          - tests/test_schema_proposer.py
          - tests/test_schema_string_validators.py
          - tests/test_search_optimizer.py
          - tests/test_simulation_bridge.py
          - tests/test_telemetry.py
          - tests/test_uncertainty_engine.py
          - tests/test_validation_engine.py
          - tests/test_waterfall_autoregister.py
          - tests/test_waterfall_enrichment.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ── Security: Block raw FastAPI imports in engine modules ────────────
  - repo: local
    hooks:
      - id: block-fastapi-in-engine
        name: Block FastAPI imports in engine modules
        entry: >
          bash -c 'if git diff --cached --name-only | grep "^app/.*\.py$" |
          grep -v "app/api/" | grep -v "app/main.py" | grep -v "handlers.py" |
          grep -v "app/score/" | grep -v "app/bootstrap/" |
          xargs grep -l "from fastapi import\|import fastapi" 2>/dev/null |
          grep -q .; then
          echo "ERROR: FastAPI imports found in engine modules (only app/api/, app/main.py, handlers.py, app/bootstrap/ allowed)";
          exit 1; fi'
        language: system
        pass_filenames: false

  # ── L9 contract enforcement ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: l9-contract-audit
        name: L9 Contract Audit
        entry: python tools/audit_engine.py --strict
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: [pyyaml, structlog]
      - id: l9-contract-verify
        name: L9 Contract Verification
        entry: python tools/verify_contracts.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ── Terminology guard (canonical terms: list[T], T | None) ──────────
  - repo: local
    hooks:
      - id: terminology-guard
        name: Check Terminology Consistency
        entry: >
          bash -c '
          VIOLATIONS=0;
          for pattern in "\\bprint\\(" "\\bOptional\\[" "\\bList\\[" "\\bDict\\["; do
            if git diff --cached --name-only | grep "\.py$" | grep -E "^(app|tests)/" |
               xargs grep -l -P "$pattern" 2>/dev/null | grep -v __pycache__ | grep -q .; then
              echo "Found forbidden term: $pattern";
              VIOLATIONS=$((VIOLATIONS+1));
            fi;
          done;
          [ $VIOLATIONS -eq 0 ] || { echo "Use: list[T], T | None, structlog"; exit 1; };
          exit 0'
        language: system
        pass_filenames: false
