# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [governance]
# tags: [L9_TEMPLATE, precommit]
# owner: platform
# status: active
# --- /L9_META ---
#
# Pre-commit hooks — mechanical enforcement before commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Sibling parity: Cognitive.Engine.Graphs/.pre-commit-config.yaml

repos:
  # ── Basic file checks ───────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        exclude: >
          (?x)^(
            \.github/.*\.yml|
            infra/k8s/helm/.*\.yaml
          )$
      - id: check-added-large-files
        args: [--maxkb=1000]

  # ── Code formatting ──────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1 (Core toolchain lock)
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^(Current Work/|LEAD ENRICHMENT|Enrichment-Deployment-pack/|"LEAD ENRICHMENT)
      - id: ruff-format
        exclude: ^(Current Work/|LEAD ENRICHMENT|Enrichment-Deployment-pack/)

  # ── Secrets scanning ─────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4  # v8.21.2
    hooks:
      - id: gitleaks
        args: ["protect", "--staged", "--config=.gitleaks.toml"]

  # ── Type checking ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 41e691678310dfd3833f7ab4e180ddb014310356  # v2.3.0 (Core toolchain lock)
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, "--exclude=app/engines/field_classifier\\.py", "--exclude=app/engines/inference_bridge_v2\\.py"]
        # Pinned to the versions the CI type-check environment resolves
        # (requirements-ci.txt + mypy --install-types), so the hook and the
        # required job type-check against the same stubs. CI installs no
        # types-aiofiles, so the hook does not either.
        additional_dependencies:
          [pydantic==2.14.3, pydantic-settings==2.16.2, types-PyYAML==6.0.12.20261103, structlog==26.1.0, httpx==0.28.1]
        language_version: python3.12
        exclude: ^(tests/|tools/|docs/|kb/|readme/|LEAD ENRICHMENT|Enrichment-Deployment-pack/|Current Work/|app/engines/field_classifier\.py|app/engines/inference_bridge_v2\.py|engine/kge/rotate3d\.py|app/engines/search_optimizer\.py|app/agents/data_hygiene\.py|plastics_enrichment_client\.py|app/models/schemas\.py|app/services/score/|app/services/perplexity_client\.py|app/services/crm/odoo_client\.py|app/services/crm/salesforce_client\.py|app/services/crm/hubspot_client\.py|app/core/config\.py|app/services/enrichment/sources/apollo\.py|app/engines/graph_sync_client\.py)

  # ── Unit tests (fast subset for pre-commit) ─────────────────────────
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest unit tests
        # No `2>/dev/null || true`: a failing unit test must fail the hook.
        entry: bash -c 'PYTHONPATH="${PYTHONPATH}:." python3 -m pytest tests/ -m "unit" --tb=short -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ── Security: Block raw FastAPI imports in engine modules ────────────
  - repo: local
    hooks:
      - id: block-fastapi-in-engine
        name: Block FastAPI imports in engine modules
        entry: >
          bash -c 'if git diff --cached --name-only | grep "^app/.*\.py$" |
          grep -v "app/api/" | grep -v "app/main.py" | grep -v "handlers.py" |
          grep -v "app/score/" | grep -v "app/health/" | grep -v "app/bootstrap/" |
          xargs grep -l "from fastapi import\|import fastapi" 2>/dev/null |
          grep -q .; then
          echo "ERROR: FastAPI imports found in engine modules (only app/api/, app/main.py, handlers.py, app/bootstrap/ allowed)";
          exit 1; fi'
        language: system
        pass_filenames: false

  # ── L9 contract enforcement ──────────────────────────────────────────
  - repo: local
    hooks:
      - id: l9-contract-audit
        name: L9 Contract Audit
        entry: python tools/audit_engine.py --strict
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: [pyyaml, structlog]
      - id: l9-contract-verify
        name: L9 Contract Verification
        entry: python tools/verify_contracts.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ── Terminology guard (canonical terms: list[T], T | None) ──────────
  - repo: local
    hooks:
      - id: terminology-guard
        name: Check Terminology Consistency
        entry: >
          bash -c '
          VIOLATIONS=0;
          for pattern in "\\bprint\\(" "\\bOptional\\[" "\\bList\\[" "\\bDict\\["; do
            if git diff --cached --name-only | grep "\.py$" | grep -E "^(app|tests)/" |
               xargs grep -l -P "$pattern" 2>/dev/null | grep -v __pycache__ | grep -q .; then
              echo "Found forbidden term: $pattern";
              VIOLATIONS=$((VIOLATIONS+1));
            fi;
          done;
          [ $VIOLATIONS -eq 0 ] || { echo "Use: list[T], T | None, structlog"; exit 1; };
          exit 0'
        language: system
        pass_filenames: false
