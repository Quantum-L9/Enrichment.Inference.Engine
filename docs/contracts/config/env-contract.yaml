# ═══════════════════════════════════════════════════════════════
# Contract: Environment Variable Contract
# Source:   app/core/config.py:Settings (pydantic-settings BaseSettings)
# Version:  2.6.0
# Updated:  2026-05-24
# ═══════════════════════════════════════════════════════════════
#
# Scope: variables below map 1:1 to Settings fields. Env names follow Pydantic
# defaults (field_name → FIELD_NAME). No extras that Settings does not load.
#
# Integration architecture: Third-party platforms (CRMs, data vendors, etc.)
# should integrate through the gate/SDK and TransportPacket actions, not
# new ad-hoc service clients in this repo. Variables for Salesforce, HubSpot,
# waterfall providers, and similar remain for legacy or transitional direct use.
#
# Files: .env then .env.local (later wins). .env.local is gitignored.
# GitHub Actions: use the same names for repository/org secrets when injecting
# deploy/runtime env (see github_actions below).
#
# Not in Settings: OpenTelemetry and ad-hoc os.getenv reads (e.g. OTEL_*,
# ENVIRONMENT in app/core/telemetry.py) — see other_runtime_env at file end.

variables:
  # ── Docker Compose ─────────────────────────────────────────
  - name: COMPOSE_PROJECT_NAME
    type: string
    required: false
    default: eie
    description: Docker Compose project name prefix for container naming.
    sensitive: false
    source: env

  - name: APP_PORT
    type: integer
    required: false
    default: 8000
    description: Host port to expose the API container.
    sensitive: false
    source: env

  - name: POSTGRES_USER
    type: string
    required: false
    default: enrich
    description: PostgreSQL user for docker-compose postgres service.
    sensitive: false
    source: env

  - name: POSTGRES_PASSWORD
    type: secret
    required: false
    default: changeme
    description: PostgreSQL password for docker-compose postgres service.
    sensitive: true
    source: env

  - name: POSTGRES_DB
    type: string
    required: false
    default: enrich
    description: PostgreSQL database name for docker-compose postgres service.
    sensitive: false
    source: env

  - name: GRAFANA_PORT
    type: integer
    required: false
    default: 3000
    description: Host port to expose Grafana dashboard.
    sensitive: false
    source: env

  - name: GRAFANA_ADMIN_USER
    type: string
    required: false
    default: admin
    description: Grafana admin username.
    sensitive: false
    source: env

  - name: GRAFANA_ADMIN_PASSWORD
    type: secret
    required: false
    default: admin
    description: Grafana admin password.
    sensitive: true
    source: env

  - name: GRAFANA_ROOT_URL
    type: url
    required: false
    default: http://localhost:3000
    description: Grafana external URL for links and redirects.
    sensitive: false
    source: env

  # ── Core ────────────────────────────────────────────────────
  - name: APP_ENV
    type: string
    required: false
    default: development
    description: Application environment (development, staging, production).
    sensitive: false
    source: env
    validation: "development | staging | production"

  # ── Perplexity Sonar ────────────────────────────────────────
  - name: PERPLEXITY_API_KEY
    type: secret
    required: false
    default: ""
    description: |
      Perplexity Sonar API key. Settings default is empty; enrichment calls need a real key.
    sensitive: true
    source: env
    example: pplx-xxxxxxxxxxxxxxxxxxxx
    validation: "non-empty for production enrichment"

  - name: PERPLEXITY_MODEL
    type: string
    required: false
    default: sonar-reasoning
    description: Perplexity Sonar model identifier.
    sensitive: false
    source: env
    example: sonar-reasoning

  # ── API (Settings fields; X-API-Key verification uses API_KEY_HASH) ──
  - name: API_SECRET_KEY
    type: secret
    required: false
    default: ""
    description: |
      Reserved / optional secret field on Settings (currently unused by auth).
      Client authentication uses X-API-Key compared to API_KEY_HASH (SHA-256 hex).
    sensitive: true
    source: env

  - name: API_KEY_HASH
    type: string
    required: false
    default: ""
    description: |
      SHA-256 hex digest of the accepted raw API key (constant-time compare in app/core/auth.py).
      Generate: python -c "import hashlib; print(hashlib.sha256(b'YOUR_KEY').hexdigest())"
    sensitive: false
    source: env

  # ── Knowledge base ───────────────────────────────────────────
  - name: KB_DIR
    type: string
    required: false
    default: /app/kb
    description: Directory containing knowledge base YAML files.
    sensitive: false
    source: env
    example: /app/kb

  # ── Redis ────────────────────────────────────────────────────
  - name: REDIS_URL
    type: url
    required: false
    default: redis://localhost:6379/0
    description: Redis URL for idempotency and related runtime features.
    sensitive: false
    source: env
    example: redis://redis:6379/0

  # ── Enrichment defaults ─────────────────────────────────────
  - name: DEFAULT_CONSENSUS_THRESHOLD
    type: float
    required: false
    default: 0.65
    description: Default minimum consensus ratio for field acceptance.
    sensitive: false
    source: env
    validation: "0.0 ≤ value ≤ 1.0"

  - name: DEFAULT_MAX_VARIATIONS
    type: integer
    required: false
    default: 5
    description: Default parallel prompt variations per enrichment.
    sensitive: false
    source: env

  - name: DEFAULT_TIMEOUT_SECONDS
    type: integer
    required: false
    default: 120
    description: Default enrichment timeout in seconds.
    sensitive: false
    source: env

  - name: MAX_CONCURRENT_VARIATIONS
    type: integer
    required: false
    default: 3
    description: Cap concurrent provider requests per enrichment call.
    sensitive: false
    source: env

  - name: MAX_ENTITIES_PER_BATCH
    type: integer
    required: false
    default: 50
    description: Maximum entities per batch enrichment request.
    sensitive: false
    source: env

  # ── Circuit breaker ──────────────────────────────────────────
  - name: CB_FAILURE_THRESHOLD
    type: integer
    required: false
    default: 5
    description: Failures before circuit opens.
    sensitive: false
    source: env

  - name: CB_COOLDOWN_SECONDS
    type: integer
    required: false
    default: 60
    description: Seconds circuit stays open before half-open retry.
    sensitive: false
    source: env

  # ── Odoo CRM ─────────────────────────────────────────────────
  - name: ODOO_URL
    type: url
    required: false
    default: ""
    description: Odoo base URL.
    sensitive: false
    source: env
    example: https://your-instance.odoo.com

  - name: ODOO_DB
    type: string
    required: false
    default: ""
    description: Odoo database name.
    sensitive: false
    source: env

  - name: ODOO_USERNAME
    type: string
    required: false
    default: ""
    description: Odoo login username.
    sensitive: false
    source: env

  - name: ODOO_PASSWORD
    type: secret
    required: false
    default: ""
    description: Odoo password.
    sensitive: true
    source: env

  - name: CRM_MAPPING_PATH
    type: string
    required: false
    default: config/crm/odoo_mapping.yaml
    description: Path to CRM field mapping YAML.
    sensitive: false
    source: env

  # ── Salesforce CRM (legacy/transitional direct integration) ──
  - name: SALESFORCE_CLIENT_ID
    type: secret
    required: false
    default: ""
    description: Salesforce connected-app OAuth client ID.
    sensitive: true
    source: env

  - name: SALESFORCE_CLIENT_SECRET
    type: secret
    required: false
    default: ""
    description: Salesforce connected-app OAuth client secret.
    sensitive: true
    source: env

  - name: SALESFORCE_USERNAME
    type: string
    required: false
    default: ""
    description: Salesforce API login username.
    sensitive: false
    source: env

  - name: SALESFORCE_PASSWORD
    type: secret
    required: false
    default: ""
    description: Salesforce API login password.
    sensitive: true
    source: env

  - name: SALESFORCE_SECURITY_TOKEN
    type: secret
    required: false
    default: ""
    description: Salesforce security token appended to the password for API auth.
    sensitive: true
    source: env

  # ── HubSpot CRM (legacy/transitional direct integration) ─────
  - name: HUBSPOT_ACCESS_TOKEN
    type: secret
    required: false
    default: ""
    description: HubSpot private-app access token.
    sensitive: true
    source: env

  # ── Enrichment sources (waterfall) ─────────────────────────
  - name: CLEARBIT_API_KEY
    type: secret
    required: false
    default: ""
    description: Clearbit API key.
    sensitive: true
    source: env

  - name: ZOOMINFO_API_KEY
    type: secret
    required: false
    default: ""
    description: ZoomInfo API key.
    sensitive: true
    source: env

  - name: APOLLO_API_KEY
    type: secret
    required: false
    default: ""
    description: Apollo.io API key.
    sensitive: true
    source: env

  - name: HUNTER_API_KEY
    type: secret
    required: false
    default: ""
    description: Hunter.io API key.
    sensitive: true
    source: env

  - name: OPENAI_API_KEY
    type: secret
    required: false
    default: ""
    description: OpenAI API key (e.g. consensus / GPT clients via OpenAIClient).
    sensitive: true
    source: env

  - name: ANTHROPIC_API_KEY
    type: secret
    required: false
    default: ""
    description: Anthropic API key (e.g. Claude via AnthropicClient).
    sensitive: true
    source: env

  # ── Constellation (Gate-only) ───────────────────────────────
  # Seam audit 2026-09-02: EIE addresses Gate only. The former direct peer
  # variables (CEG_BASE_URL, GRAPH_NODE_URL, SCORE_NODE_URL, ROUTE_NODE_URL,
  # INTER_NODE_SECRET) and the Neo4j client variables (NEO4J_URI, NEO4J_USER,
  # NEO4J_PASSWORD) are retired: EIE has no graph-store client and no peer URL.
  - name: GATE_URL
    type: url
    required: false
    default: http://localhost:8080
    description: Gate service base URL for SDK runtime and Gate-only egress (the only peer EIE addresses).
    sensitive: false
    source: env

  - name: GATE_REGISTRATION_ENABLED
    type: boolean
    required: false
    default: "false"
    description: Register this node with Gate at startup via Gate_SDK register_node (Settings gate_registration_enabled). Required for Gate to route converge/enrich to EIE.
    sensitive: false
    source: env

  - name: GATE_INTERNAL_URL
    type: url
    required: false
    default: ""
    description: Cluster-internal URL Gate dispatches to (Settings gate_internal_url). Empty derives http://enrichment-engine:8000.
    sensitive: false
    source: env

  - name: GATE_ADMIN_TOKEN
    type: secret
    required: false
    default: ""
    description: Gate admin token presented on registration (Settings gate_admin_token).
    sensitive: true
    source: env

  - name: GRAPH_SYNC_ENTITY_TYPE
    type: string
    required: false
    default: facilities
    description: CEG `sync` endpoint suffix the post-enrichment graph sync targets (Settings graph_sync_entity_type).
    sensitive: false
    source: env

  - name: GRAPH_SYNC_ID_PROPERTY
    type: string
    required: false
    default: facility_id
    description: Id property of that CEG sync endpoint (Settings graph_sync_id_property).
    sensitive: false
    source: env

  # ── Gate_SDK runtime / client contract (read by constellation_node_sdk, not Settings) ──
  - name: L9_ENVIRONMENT
    type: string
    required: false
    default: local
    description: SDK runtime environment (local|dev|test|staging|prod). staging/prod require L9_REQUIRE_SIGNATURE=true.
    sensitive: false
    source: env

  - name: L9_NODE_NAME
    type: string
    required: false
    default: enrichment-engine
    description: SDK node identity for Gate_SDK client config; must equal the registered node name.
    sensitive: false
    source: env

  - name: L9_REQUIRE_SIGNATURE
    type: boolean
    required: false
    default: "false"
    description: Require verified transport signatures on Gate-only ingress and sign outbound packets.
    sensitive: false
    source: env

  - name: L9_SIGNING_ALGORITHM
    type: string
    required: false
    default: hmac-sha256
    description: Transport signing algorithm (hmac-sha256|ed25519).
    sensitive: false
    source: env

  - name: L9_SIGNING_KEY
    type: secret
    required: false
    default: ""
    description: HMAC signing key shared with Gate (sensitive; never committed).
    sensitive: true
    source: env

  - name: L9_SIGNING_KEY_ID
    type: string
    required: false
    default: enrichment-engine-v1
    description: Key id carried on signed packets.
    sensitive: false
    source: env

  - name: L9_VERIFYING_KEYS_JSON
    type: string
    required: false
    default: ""
    description: JSON object mapping key_id to key for verifying Gate-signed packets.
    sensitive: true
    source: env

  - name: DATABASE_URL
    type: url
    required: false
    default: postgresql+asyncpg://enrich:changeme@localhost:5432/enrich
    description: Async SQLAlchemy URL (asyncpg driver).
    sensitive: true
    source: env
    example: postgresql+asyncpg://enrich:secret@db:5432/enrich

  # ── Domain packs ────────────────────────────────────────────
  - name: DOMAINS_DIR
    type: string
    required: false
    default: ./domains
    description: Directory of domain YAML specs.
    sensitive: false
    source: env

  - name: DEFAULT_DOMAIN
    type: string
    required: false
    default: plasticos
    description: Default domain id when request omits one.
    sensitive: false
    source: env

  # ── Token budget ─────────────────────────────────────────────
  - name: MAX_BUDGET_TOKENS
    type: integer
    required: false
    default: 50000
    description: Canonical max tokens per convergence run.
    sensitive: false
    source: env

  - name: MAX_BUDGET_TOKENS_DEFAULT
    type: integer
    required: false
    default: 50000
    description: |
      Legacy alias; if set without changing MAX_BUDGET_TOKENS from default 50000,
      Settings validator copies this to max_budget_tokens (see app/core/config.py).
    sensitive: false
    source: env

  - name: TOKEN_RATE_USD_PER_1K
    type: float
    required: false
    default: 0.005
    description: USD per 1k tokens for cost tracking.
    sensitive: false
    source: env

  # ── Logging ──────────────────────────────────────────────────
  - name: LOG_LEVEL
    type: string
    required: false
    default: INFO
    description: Log level for structlog/logging.
    sensitive: false
    source: env
    validation: "DEBUG | INFO | WARNING | ERROR | CRITICAL"

# ── Operational checklists (not Pydantic "required") ─────────
required_for_startup:
  - API_KEY_HASH
  - PERPLEXITY_API_KEY

required_for_caching:
  - REDIS_URL

required_for_persistence:
  - DATABASE_URL

required_for_odoo_integration:
  - ODOO_URL
  - ODOO_DB
  - ODOO_USERNAME
  - ODOO_PASSWORD

# ═══════════════════════════════════════════════════════════════
# Env read outside Settings (documentary only)
# ═══════════════════════════════════════════════════════════════
other_runtime_env:
  description: |
    Not loaded by app/core/config.py Settings. Examples: OTEL_EXPORTER_OTLP_ENDPOINT,
    OTEL_SERVICE_NAME, ENVIRONMENT, VERSION — see app/core/telemetry.py.

# ═══════════════════════════════════════════════════════════════
# GitHub Actions — secrets & variables (CI / deploy / review bots)
# ═══════════════════════════════════════════════════════════════
#
# Secret model:
#   platform_wide  — org-level secrets, selected repositories.
#                    Set once at org level; all constellation repos share them.
#   repo_specific  — set only on this repository; runtime or deploy secrets
#                    that differ per engine.
#
github_actions:
  secrets:
    # ── Platform-wide CI secrets (org-level, selected repositories) ──────
    - name: GITGUARDIAN_API_KEY
      map_to_env: null
      required: optional
      scope: platform_wide
      workflows: [.github/workflows/gitguardian.yml]
      notes: |
        GitGuardian ggshield secret scan. Set at org level and grant access to
        this repo. Workflow skips gracefully if unset.

    - name: SONAR_TOKEN
      map_to_env: null
      required: optional
      scope: platform_wide
      workflows: [.github/workflows/sonarcloud.yml]
      notes: SonarCloud user token. Pair with SONAR_ORG_KEY + SONAR_PROJECT_KEY variables.

    - name: CODECOV_TOKEN
      map_to_env: null
      required: optional
      scope: platform_wide
      workflows: [.github/workflows/ci.yml]
      notes: Optional Codecov upload; ci.yml tolerates missing token.

    - name: PERPLEXITY_API_KEY
      map_to_env: PERPLEXITY_API_KEY
      required: optional
      scope: platform_wide
      workflows: [.github/workflows/perplexity-code-review.yml]
      notes: |
        PR advisory AI diff review. If unset, workflow skips. Same name as runtime Settings.

    # ── Repo-specific deploy secrets ─────────────────────────────────────
    # No active deploy secrets are required for standard CI operation.
    # K8s deploy workflow (k8s-deploy.yml) is manual-dispatch only and
    # requires out-of-band infrastructure configuration.

  variables_non_secret:
    - name: SONAR_ORG_KEY
      scope: repo_specific
      workflows: [.github/workflows/sonarcloud.yml]
      notes: SonarCloud organization key.

    - name: SONAR_PROJECT_KEY
      scope: repo_specific
      workflows: [.github/workflows/sonarcloud.yml]
      notes: SonarCloud project key.

  paid_third_party:
    description: |
      CodeRabbit and SonarCloud are configured outside env files: billing + GitHub App,
      SonarCloud import + token/variables. See CODERABBIT.md and sonar-project.properties.

  not_user_configurable:
    - name: GITHUB_TOKEN
      notes: Auto-provided to workflows.

  runtime_overlap:
    description: |
      Any variable in `variables:` can be set as a GitHub encrypted secret for deploy
      workflows; name the secret to match the env var (e.g. PERPLEXITY_API_KEY, DATABASE_URL).

  bulk_upload:
    description: Push secrets from .env.local via GitHub CLI or org secrets.
    tool: tools/sync_github_actions_secrets.sh
    notes: gh secret set -f .env.local -R owner/repo
