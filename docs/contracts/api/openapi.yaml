  /score/compare:
    post:
      operationId: compareScores
      summary: Compare before/after scores for an entity
      description: |
        Reads each side by its own id — `score_store.get_score_by_id(before_score_id)`
        and `score_store.get_score_by_id(after_score_id)` — and compares them in
        that order, whichever is newer. A record that does not exist, or that
        belongs to an entity other than `entity_id`, is 404 for that side
        (checked before, then after). Before 2.4.1 the handler read both sides
        with `get_score(entity_id, entity_id)` and ignored both ids.
      tags: [score]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareScoresRequest"
      responses:
        "200":
          description: Score comparison (`operation` = `compare_scores`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScoreEnvelope"
                  - type: object
                    properties:
                      payload:
                        type: object
                        description: "`ScoreExplainer.compare_scores(...)` (app/score/score_explainer.py)."
                        properties:
                          entity_id:
                            type: string
                          composite_before:
                            type: number
                          composite_after:
                            type: number
                          composite_delta:
                            type: number
                          tier_before:
                            $ref: "#/components/schemas/ScoreTier"
                          tier_after:
                            $ref: "#/components/schemas/ScoreTier"
                          tier_changed:
                            type: boolean
                          dimension_deltas:
                            type: object
                          fields_resolved:
                            type: array
                            items:
                              type: string
                          fields_newly_missing:
                            type: array
                            items:
                              type: string
                          missing_before:
                            type: integer
                          missing_after:
                            type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScoreForbidden"
        "404":
          description: |
            `Before score record not found for entity`,
            `After score record not found for entity`, or
            `Scoring profile not found`.
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ScoreDependenciesNotConfigured"
