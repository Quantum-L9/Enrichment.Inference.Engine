              node_label:
                type: string
              field_name:
                type: string
        discovery_spec_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Exact original discovery artifact digest retained end-to-end; changed source requires fresh discovery.
        publication_status:
          type: string
