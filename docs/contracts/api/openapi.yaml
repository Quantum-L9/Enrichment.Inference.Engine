        tier:
          $ref: "#/components/schemas/ScoreTier"
        composite_confidence:
          type: number
        dimension_scores:
          type: object
          description: Keyed by `ScoreDimension` value.
          additionalProperties:
            type: object
            properties:
              score:
                type: number
              confidence:
                type: number
              weight:
                type: number
              coverage:
                type: number
              fields_evaluated:
                type: integer
              fields_present:
                type: integer
              missing_count:
                type: integer
        missing_field_count:
          type: integer
        gate_critical_missing:
          type: array
          items:
            type: string
        enrichment_triggers:
