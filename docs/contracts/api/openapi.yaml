        "200":
          description: Batch convergence initiated
          content:
            application/json:
              schema:
                type: object
      x-source-file: app/api/v1/converge.py

  /v1/converge/{run_id}:
    get:
      operationId: getConvergeStatus
      summary: Check convergence loop progress
      tags: [convergence]
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The convergence run UUID.
      responses:
        "200":
          description: Loop state
          content:
            application/json:
              schema:
                type: object
                description: |
                  The dict `get_convergence_status` builds from the stored `LoopState`
                  (app/engines/convergence/loop_state.py). It is NOT `ConvergeResponse`
                  (app/models/loop_schemas.py): the loop phase is `status` (a
                  `LoopStatus` value) and the pass counter is `current_pass`. There is
                  no `state` or `pass_count` key in this response.
                required:
                  - run_id
                  - entity_id
                  - domain
                  - node_label
                  - discovery_spec_sha256
                  - ownership_contract_version
                  - status
                  - current_pass
                  - fields_accumulated
                  - cost
                  - created_at
                  - updated_at
                properties:
                  run_id:
                    type: string
                  entity_id:
                    type: string
                  domain:
                    type: string
                  node_label:
                    type: [string, "null"]
                    description: Null on historical runs; never authorizes approval.
                  discovery_spec_sha256:
                    type: [string, "null"]
                  ownership_contract_version:
                    type: [integer, "null"]
                  status:
                    type: string
                    enum: [running, converged, budget_exhausted, max_passes, diminishing_returns, human_hold, failed]
                    description: "`LoopState.status.value` (`LoopStatus`)."
                  current_pass:
                    type: integer
                    description: "`LoopState.current_pass` — passes started so far."
                  fields_accumulated:
                    type: integer
                    description: "`len(LoopState.accumulated_fields)`."
                  cost:
                    $ref: "#/components/schemas/CostSummary"
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Run ID not found
