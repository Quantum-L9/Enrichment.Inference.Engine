    ConvergeApprovalRequest:
      title: ConvergeApprovalRequest
      description: |
        Reviewer decisions on the schema proposals of one held convergence run
        (`POST /v1/converge/{run_id}/approve`). Every decided field is persisted
        to `schema_proposals` (approved and rejected) in one transaction using
        recorded (node_label, field_name) ownership. Native runtime remains on
        immutable published YAML until separately reviewed operator publication.
      type: object
      required:
        - decisions
        - reviewed_by
      properties:
        decisions:
          type: array
          items:
            type: object
            required:
              - field_name
              - node_label
            properties:
              field_name:
                type: string
                example: annual_capacity_mt
              node_label:
                type: string
                pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
                maxLength: 128
                description: Equality assertion against the recorded discovery owner, never an owner selector.
              approved:
                type: boolean
                default: true
              reason:
                type: string
                default: ""
        reviewed_by:
          type: string
          minLength: 1
          maxLength: 256
          description: Explicit named, unpadded reviewer recorded on every durable decision. Blank or padded values are refused. Immutable retries preserve original review coordinates.
      x-source-file: app/api/v1/converge.py:435

    ConvergeApprovalResponse:
      title: ConvergeApprovalResponse
      type: object
      properties:
        run_id:
          type: string
        approved:
          type: integer
          description: |
            Fields the approval applied to the spec (approved, proposed and
            canonically named) -- not the number of approving decisions.
        rejected:
          type: integer
          description: "Decisions with `approved: false`."
        unapplied:
          type: array
          items:
            type: array
