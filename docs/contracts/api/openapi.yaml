  # ── Score service ──────────────────────────────────────────
  # Mounted by app/main.py `app.include_router(score_router)`; the router's
  # own prefix is `/score`, so these paths carry no `/v1` segment. Router-level
  # dependencies on every route: `verify_api_key` (401/403) then
  # `require_direct_tenant_read` (403 outside L9_ENVIRONMENT local/dev/test).
  # Every 200 body is a `ScoreEnvelope`; `payload` varies per operation.
  /score/entity:
    post:
      operationId: scoreEntity
      summary: Score a single entity against a scoring profile
      tags: [score]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreEntityRequest"
      responses:
        "200":
          description: Entity scored (`operation` = `score_entity`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScoreEnvelope"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/ScoreEntityPayload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ScoreForbidden"
        "404":
          description: Scoring profile not found
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ScoreDependenciesNotConfigured"
      x-source-file: app/score/score_api.py:216

