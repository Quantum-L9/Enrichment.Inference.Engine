      responses:
        "200":
          description: Batch results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchEnrichResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
      x-source-file: app/main.py:106

  # ── Chassis ────────────────────────────────────────────────
  /v1/execute:
    post:
      operationId: executePacket
      summary: L9 Chassis — universal packet ingress
      description: |
        Accepts any PacketEnvelope and routes it to the registered handler.
        The `action` field determines which handler fires.

        Supported actions: `enrich`, `enrichbatch`, `converge`, `discover`, `enrich_and_sync`

        For use by other L9 constellation nodes only. External HTTP clients
        (Salesforce, Odoo) use /api/v1/enrich directly.
      tags: [chassis]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PacketEnvelope"
            example:
              action: enrich
              payload:
                entity:
                  name: "Acme Plastics"
                object_type: Account
                objective: "Enrich company profile"
              tenant: "acme-corp"
              source_node: "score-engine"
      responses:
        "200":
          description: Routed packet result envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PacketEnvelopeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No handler registered for the requested action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Envelope validation failed (missing action, hash mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
