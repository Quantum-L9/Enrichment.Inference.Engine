    HealthCheckResponse:
      title: HealthCheckResponse
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        version:
          type: string
          example: "2.3.0"
        kb_loaded:
          type: boolean
          description: Whether the knowledge base index is loaded.
        kb_polymers:
          type: integer
          description: Number of polymer types in the KB.
        kb_grades:
          type: integer
          description: Total grade entries in the KB.
        kb_rules:
          type: integer
          description: Total inference rules loaded.
        circuit_breaker_state:
          type: string
          enum: [closed, open, half-open]
          description: Circuit breaker state for external API calls.
        gate_registered:
          type: boolean
          nullable: true
          description: |
            TASK-003. null = registration disabled or never attempted,
            true = Gate accepted this node, false = Gate rejected it or the
            attempt errored. Kept for clients that already read it; prefer
            gate_registration, which distinguishes the two null cases.
        gate_registration:
          type: string
          enum: [registered, failed, not_attempted, disabled]
          example: registered
          description: |
            EIE-002. Names the registration state outright, because
            `gate_registered is null` cannot tell "switched off" from "enabled
            but never attempted" — and the second is a node Gate cannot route
            to. `failed` and `not_attempted` both degrade `status`.
      x-source-file: app/models/schemas.py:149
      additionalProperties: false

    ReadinessResponse:
      title: ReadinessResponse
      type: object
      description: |
        EIE-212-F003. The routability signal a Kubernetes readinessProbe reads.
        HealthCheckResponse names a degraded registration in its body but always
        rides HTTP 200; a probe reads the status code, so an unroutable pod was
        marked Ready. This body rides HTTP 503 when registration is enabled but
        `failed` or `not_attempted`, and HTTP 200 when `registered` or `disabled`.
      required: [ready, status, gate_registration]
      properties:
        ready:
          type: boolean
        status:
          type: string
          enum: [ready, not_ready]
        gate_registration:
          type: string
          enum: [registered, failed, not_attempted, disabled]
        version:
          type: string
          example: "2.3.0"
      x-source-file: app/models/schemas.py:172
      additionalProperties: false

    PacketEnvelope:
      title: PacketEnvelope
      description: |
        L9 chassis wire format for node-to-node communication.
        Source: chassis/envelope.py
      type: object
      required:
        - action
        - payload
      properties:
        action:
          type: string
          enum: [enrich, enrichbatch, converge, discover, enrich_and_sync, writeback]
          description: Handler action to invoke.
        payload:
          type: object
          additionalProperties: true
          description: Action-specific payload dict.
        tenant:
          oneOf:
            - type: string
            - type: object
              properties:
                actor:
                  type: string
          description: Tenant identifier (string or object with actor field).
          example: "acme-corp"
        content_hash:
          type: string
          description: |
            Optional SHA-256 of canonical(action+payload+tenant). If provided,
            server verifies before processing.
          example: "a3f1b2c4d5e6..."
        source_node:
          type: string
          description: Originating node identifier.
          example: "score-engine"
        reply_to:
          type: string
          description: Node to receive the response.
        lineage:
          type: object
          description: Packet lineage chain for distributed tracing.
        governance:
          type: object
          description: Compliance and audit metadata.
      x-source-file: chassis/envelope.py
      additionalProperties: true

