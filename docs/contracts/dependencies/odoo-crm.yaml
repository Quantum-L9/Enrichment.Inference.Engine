# ═══════════════════════════════════════════════════════════════
# Contract: Odoo CRM Dependency
# Source:   app/services/crm/odoo_client.py, app/services/crm/writeback.py,
#           app/services/crm/base.py (CLIENT_REGISTRY), config/crm/odoo_mapping.yaml
# Version:  2.0.0
# Updated:  2026-11-08 (the live Odoo relationship is Gate-routed `converge`, not
#           HTTP /api/v1/enrich; this file now covers only EIE's optional XML-RPC
#           writeback connector, which is disabled unless a trusted owner activates it)
#           2026-04-05 (initial)
# ═══════════════════════════════════════════════════════════════

service_name: OdooCRM
type: external
protocol: xmlrpc  # /xmlrpc/2/common and /xmlrpc/2/object (defusedxml-patched)
auth_method: Odoo username + password, supplied per connector in CRMCredentials (url, db, username, password)
required: false

# No Settings field or env var names an Odoo connection. OdooClient takes its
# connection only from the CRMCredentials of a TrustedCRMConnector that the
# connector owner supplies; app/core/config.py declares nothing per provider.
declared_env: []
declared_env_consumed: false

role: |
  Optional CRM writeback target. EIE resolves OdooClient from the provider
  registry (app.services.crm.base.CLIENT_REGISTRY, key "odoo", registered by
  odoo_client.py at import) when WriteBackOrchestrator writes enriched fields
  back to a CRM. The orchestrator never names a provider: a TrustedCRMConnector
  carries the provider key, credentials, mapping path and an activation level,
  and the default level is CRMActivationLevel.DISABLED: nothing is written to
  Odoo until the trusted owner sets local_test, gate_sandbox or
  production_enabled.

  This is NOT how the live PlasticOS Odoo talks to EIE. IB-Odoo_19
  (plasticos_gate / plasticos_enrichment) sends the Gate action `converge` as a
  Gate_SDK TransportPacket, Gate routes it to EIE, and
  app.engines.handlers.handle_converge answers with an EnrichResponse. Odoo
  never calls EIE's HTTP API directly (IB-Odoo_19 ADR-003-single, ADR-002), and
  it applies its own allowlisted partner writeback from that response. That
  path is governed by dependencies/constellation-gate.yaml and the canonical
  converge fixture contracts/converge_request.json, not by this file.

  odoo_modules/plasticos_research_enrichment in this repository is not the live
  producer. IB-Odoo_19 does not install it.

usages:
  - purpose: CRM writeback when a trusted connector activates it
    source_file: app/services/crm/odoo_client.py
    pattern: OdooClient(credentials).update_record / query_records over XML-RPC
  - purpose: EIE field name -> Odoo model/field mapping for that writeback
    source_file: config/crm/odoo_mapping.yaml
    pattern: TrustedCRMConnector.mapping_path (app/services/crm/writeback.py)

failure_semantics: |
  A query timeout is not reported as not-found, and a false write
  acknowledgement is rejected (tests/contracts/test_crm_provider_parity.py).

field_mapping: config/crm/odoo_mapping.yaml
source_file: app/services/crm/odoo_client.py
