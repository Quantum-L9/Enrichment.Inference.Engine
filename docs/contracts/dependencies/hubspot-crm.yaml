#           runtime attestation stops counting HubSpot ready with no token)
#           2026-10-29 (producer outcome TRANSPORT_UNAVAILABLE split from
#           NOT_ACKNOWLEDGED on transport signals only, GAR A5)
#           2026-10-25 (QM.POC0.EIE.OBSERVED_RELATIONSHIP_PRODUCER.003: read-only
