#           2026-10-25 (QM.POC0 closure: the relationship idempotency key hashes the tenant
#           and the resolved contract's entity_type / relation_type / from_label /
#           to_label with the row, not the row alone)
#           2026-10-25 (QM.POC0.EIE.GRAPH_EVIDENCE.002B: relationship evidence sync over
#           the same Gate `sync` action, to a spec-declared targetedge endpoint)
#           2026-10-23 (PR #248 audit: resolved per TENANT, the spec CEG validates
#           against; illegal ids refused by the reader's tenant grammar; an unmatched
#           explicit label is ambiguous; the settings fallback is empty by default)
#           2026-10-22 (GRAPH-IDENT-02: the CEG sync endpoint is resolved per domain
