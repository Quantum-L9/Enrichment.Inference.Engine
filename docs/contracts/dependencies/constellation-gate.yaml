#           CEG cross-checks it against its own observedfrom. Sent only while
#           observed_association_send_enabled is on (default off until the deployed CEG
#           accepts the key, Cognitive.Engine.Graphs#422). CEG's refusal
#           `ObservedAssociationRejectedError` is reported as MAPPING_REJECTED_BY_CEG)
#           2026-10-29 (QM.POC0.TENANT_ASSOCIATION_MAPPING.004: an observed provider
#           association resolves to its relationship and node refs only from the tenant
#           spec's sync.endpoints[].observedfrom / refnamespace, before any provider I/O,
#           and every resolution is labelled an unverified EIE mirror until CEG's D-9
#           cross-check, Cognitive.Engine.Graphs#386)
#           2026-10-29 (GAR A1/A5: CEG's relationship evidence identity is (tenant,
#           relationship type, evidence_ref) -- the same evidence_ref under another type
#           is a separate assertion; notify_relationship_sync answers a typed
#           RelationshipSyncResult that tells TRANSPORT_UNAVAILABLE from NOT_ACKNOWLEDGED
