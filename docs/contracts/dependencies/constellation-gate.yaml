service_name: Constellation.Gate
type: internal
protocol: http  # canonical TransportPacket over POST /v1/execute (Gate_SDK)
auth_method: Transport signatures (L9_SIGNING_KEY / L9_SIGNING_KEY_ID via Gate_SDK); admin token for registration
connection_env: GATE_URL
default_url: http://localhost:8080

usages:
  - purpose: Gate-only egress — post-enrichment graph sync (CEG action `sync`)
    source_file: app/engines/packet_router.py
    pattern: GateClient.execute(action="sync", payload={entity_type, batch})

  - purpose: Gate-only egress — relationship evidence sync (CEG action `sync`, targetedge endpoint)
    source_file: app/engines/packet_router.py
    pattern: GateClient.execute(action="sync", payload={entity_type, batch:[{from_id, to_id, evidence_ref, source_ref, confidence, assertion_status, polarity, source_revision?, expires_at?, observed_association?}]})

  - purpose: Gate-only egress — graph match / outcomes (CEG actions `match`, `outcomes`)
    source_file: app/engines/graph_sync_client.py
    pattern: GateClient.send_to_gate(TransportPacket destination=gate)

  - purpose: Gate-only ingress — SDK runtime POST /v1/execute (converge, enrich, graph-inference-result)
    source_file: app/main.py
    pattern: create_node_app(config=NodeRuntimeConfig) with enforce_gate_only_ingress

  - purpose: Gate-only ingress consumption — graph-inference-result targets feed convergence
    source_file: app/engines/convergence_controller.py
    pattern: GraphReturnChannel.take_for_entity(tenant_id, entity_id) at the start of each run_convergence_loop pass

  - purpose: Node registration (control plane)
    source_file: app/main.py
    pattern: register_node(gate_url, NodeRegistration) -> POST /v1/admin/register

invariants:
  - EIE never addresses a peer node; every outbound packet targets Gate.
  - EIE has no graph-store (Neo4j) client; the graph is reached only through Gate -> CEG.
  - Gate unavailability fails closed; there is no direct node-to-node fallback.
  - A graph-inference-result target is applied only to a converge for the packet's
    Gate tenant and the output's entity_id; no target crosses a tenant or entity.
  - A graph-inference-result target never overwrites a value the converge request's
    entity supplied; it fills unknown fields or outranks lower-confidence loop output.
  - A worker `failure` packet relayed by Gate (packet_type `failure`, or a response hop
    with status `failed`) is not a routed success — PacketRouter.route raises
    NodeOperationFailedError and never returns the failure payload as data. It is not
    retried at the transport; Gate did not cache it (SEAM-013), so the caller's retry
    is not answered from a stale failure.
  - The post-enrichment graph sync is recorded as synchronized only on CEG's `sync`
    acknowledgment for the intended operation — `graph_sync_acknowledged` requires
    status `success`, an integer `synced_count` equal to the batch EIE sent (one row)
    and the configured sync endpoint. None, a failure or rejected answer, a malformed
    answer, or an exception each leave `graph_synced` false; the key then stays
    pending for the graph leg only, so a permitted retry re-attempts the sync — with
    the fields that were persisted and emitted on the first attempt, never the
    retrying call's — without re-persisting, re-emitting or re-invalidating
    (RV-DOMAIN-RD-07).
  - The `sync` endpoint and its id property are resolved PER TENANT from the
    tenant's own spec (tenant id == domain spec id; `domains/<tenant>/spec.yaml`
    `sync.endpoints[]`, CEG's owner-native `path` / `targetnode` / `idproperty`;
    `entity_type` is the path's last segment), by `PacketRouter.graph_sync_contract`
    keyed by the packet's `tenant_id` — the spec CEG loads (`load_domain(tenant)`)
    to validate the same sync. The payload `domain` never selects the spec; it is
    carried on the row, and a `domain` other than the tenant is logged as
    `graph_sync_domain_is_not_tenant`. Selection order — the caller's `node_label`
    matching exactly one `targetnode`; else the single declared endpoint; else, only
    when the caller supplied NO `node_label`, the single endpoint whose `targetnode`
    is a label of the spec's own ontology. `notify_graph_sync` checks CEG's
    acknowledgment against the endpoint it resolved, never a global default
    (GRAPH-IDENT-02).
  - A spec that declares endpoints but none can be selected is AMBIGUOUS — including
    an explicit `node_label` that no endpoint among several targets — nothing is
    sent, `graph_sync_skipped_ambiguous_contract` names the domain and the
    candidates, `notify_graph_sync` returns None (not synced), and the settings
    fallback is not consulted. A row whose entity type the spec cannot name must
    not land on another entity type's endpoint.
  - An id outside the one tenant grammar (`is_legal_tenant_id` in
    app/engines/domain_yaml_reader.py) never reaches the filesystem;
    `DomainYamlReader.load` refuses it with `ValueError` before building a path, so
    `../x` or an absolute path cannot select a spec outside the domains root. The
    router treats that refusal as "declares no endpoint" (next invariant).
  - The labeled fallback `Settings.graph_sync_entity_type` / `graph_sync_id_property`
    applies only when the spec declares no endpoint at all (no `sync` section, an
    unknown tenant, an illegal id, an unreadable, malformed or wrong-shaped file);
    every use is logged as `graph_sync_contract_resolved` with `source="settings_fallback"`.
    Both default to empty, so such a tenant fails closed — nothing is sent and
    `graph_sync_skipped_no_contract` names it. The plasticos spec declares CEG's
    endpoints itself (`domains/plasticos/spec.yaml` `sync`, in lockstep with CEG's).
  - The entity's node label travels from the handler (`payload["node_label"]`, else
    `object_type`) through `SideEffectCoordinator.commit_after_enrich(node_label=)` to
    `notify_graph_sync(node_label=)`; a graph-leg retry re-sends the label of the
    first attempt together with the fields and domain it pins.
  - Relationship evidence (`PacketRouter.notify_relationship_sync`) travels on the same
    `sync` action — no new action, no second client. Its endpoint is resolved PER TENANT
    from the tenant's own spec — exactly one `sync.endpoints[]` entry with this
    `targetedge` / `fromnode` / `tonode` and no `targetnode`, AND exactly one matching
    `ontology.edges` entry declared DIRECTED and managed by sync — the
    declaration CEG validates the row against. A reversed direction, an undeclared type
    or two candidate endpoints send nothing (`relationship_sync_skipped_no_contract`);
    there is no settings fallback for relationships.
  - EIE proposes, CEG admits. The row carries only the endpoints' declared stable ids and
    the producer's evidence — `evidence_ref`, `source_ref`, explicit `confidence` in
    [0, 1], `assertion_status` (observed / reported / inferred), `polarity` (positive /
    negative), optional `source_revision` / `expires_at` / `observed_association` — never a label, relationship
    type, tenant, database, relevance or score. An assertion missing any of them is
    skipped with its defects (`relationship_sync_skipped_incomplete_assertion`); nothing
    is defaulted.
  - D-9 (Cognitive.Engine.Graphs#386): with `observed_association_send_enabled` on, an
    observed row carries `observed_association` {provider, fromobjecttype, toobjecttype,
    associationcategory, associationtypeid} -- the association EIE's mirror mapped. CEG
    refuses the row unless its OWN tenant spec's `observedfrom` declares it, answering
    `ObservedAssociationRejectedError`; the producer reports that as
    `MAPPING_REJECTED_BY_CEG` (`observed_association_mirror_drift`). Order: deploy the
    CEG change, turn this on, then CEG's `OBSERVED_ASSOCIATION_REQUIRED`. An older CEG
    refuses the unknown key, so this ships off.
  - A relationship is synchronized only on CEG's relationship acknowledgment —
    `relationship_sync_acknowledged` requires `graph_sync_acknowledged` for the resolved endpoint
    AND integer `created_count` + `replayed_count` equal to the rows sent. A node-shaped
    acknowledgment never marks a relationship synced. The idempotency key
    (`eie:relsync:<tenant>:<evidence_ref>:<digest>`) is pinned to the exact assertion; the
    digest covers the tenant, the resolved contract's `entity_type`, `relation_type`,
    `from_label` and `to_label`, and the complete row. A retry resends the same assertion
    and Gate answers a completed one from its keyed cache; a changed row, or the same
    `evidence_ref` proposed for a different relationship or endpoint, gets a new key.
  - CEG owns relationship evidence identity, and it is `(tenant, relationship type,
    evidence_ref)` (Cognitive.Engine.Graphs `engine/sync/generator.py` -- one edge per
    `MERGE (a)-[r:<type> {evidence_ref}]->(b)` under the tenant, enforced by a per-type
    `REQUIRE (r._tenant, r.evidence_ref) IS UNIQUE` constraint). The same `evidence_ref`
    proposed under a DIFFERENT relationship type is a separate assertion, not a conflict.
    Within the SAME type, an exact replay is a no-op and a reuse with different endpoints
    or evidence is a conflict CEG refuses (`ON CREATE SET` only; stored provenance is never
    overwritten) -- EIE sees that refusal as `NOT_ACKNOWLEDGED`.
  - The relationship send always answers a typed `RelationshipSyncResult` from
    `notify_relationship_sync` (`outcome`, `detail`, `ack`); only `ACKNOWLEDGED`
    carries CEG's ack and means synced. `NOT_PROPOSED` -- nothing was sent (incomplete assertion, or no declared endpoint).
    `TRANSPORT_UNAVAILABLE` -- Gate could not carry the row -- `GateConnectionError`,
    `GateTimeoutError`, or a Gate 5xx (`GateHTTPError.is_server_error`) -- after the
    retries the pinned idempotency key allows are spent; the graph may or may not hold
    the row and a later retry of the same assertion reuses the key. `NOT_ACKNOWLEDGED` --
    Gate carried it and the answer is not a confirmation -- a `failure` packet
    (`NodeOperationFailedError`), a Gate 4xx, an ack that does not confirm this row on
    this endpoint, or any other Gate-client failure. The classification
    (`relationship_failure_outcome`) reads only Gate_SDK client error types and the
    transport-level `failure` signal; it never reads the worker's error name inside a
    failure packet, so no CEG exception class name couples the two nodes (GAR A5).
  - Observed provider associations (`PacketRouter.observed_association_contract`,
    `app/engines/observed_association_contract.py`) resolve PER TENANT from the tenant's
    own spec, before the provider is read -- exactly one `sync.endpoints[].observedfrom`
    entry (`provider`, `fromobjecttype`, `toobjecttype`, `associationcategory`,
    `associationtypeid`; CEG's grammars, unknown keys and non-integer ids refused) on a
    relationship endpoint that `resolve_relationship_sync_contract` accepts, and a
    `refnamespace` on the node endpoints of both its labels. The relation type, direction
    and labels come from that endpoint, the graph refs `<refnamespace>:<record id>` from
    the node endpoints. Nothing comes from the caller and there is no fallback. Any
    malformed or conflicting declaration anywhere in the spec, a duplicate key, a reversed
    object-type pair, or a missing namespace resolves nothing
    (`observed_association_skipped_<reason>`), and nothing is read or sent.
  - EIE's spec is a lockstep MIRROR of CEG's tenant spec, not CEG's approval. CEG does not
    yet cross-check an observed row against its own `observedfrom` (D-9,
    Cognitive.Engine.Graphs#386, required before live acceptance), so every producer
    result after resolution carries `mapping_verification =
    eie_mirror_unverified_by_ceg` and the mirror's `mapping_fingerprint`;
    `mirror_drift(mirror, ceg_spec)` lists every divergence of the mapping declarations.
  - No live EIE producer of typed relationships exists as of 1.8.0; nothing on the
    enrichment path calls `notify_relationship_sync` (SOURCE_NOT_AVAILABLE).

health_check: "GET {GATE_URL}/v1/health"
