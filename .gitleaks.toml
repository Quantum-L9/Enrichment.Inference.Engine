# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: enrichment
# layer: [security]
# tags: [L9_TEMPLATE, security, secrets]
# owner: platform
# status: active
# --- /L9_META ---
#
# Gitleaks configuration — custom secret detection rules
# Sibling parity: Cognitive.Engine.Graphs/.gitleaks.toml

title = "L9 Enrichment Engine — Gitleaks Configuration"

# ── Custom Rules ──────────────────────────────────────────────────────────

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[a-zA-Z0-9]{20,}'''
tags = ["api", "openai"]

[[rules]]
id = "perplexity-api-key"
description = "Perplexity API Key (Sonar enrichment)"
regex = '''pplx-[a-zA-Z0-9]{40,}'''
tags = ["api", "perplexity"]

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[=:]\s*['"][a-zA-Z0-9_\-]{20,}['"]'''
tags = ["api", "generic"]

  # Named fixture: a made-up key used only as a client-cache dictionary key in
  # one unit test. It is the single finding the former `tests/` path allowlist
  # was hiding (measured over every ref with Gitleaks 8.24.3).
  [rules.allowlist]
  description = "Fake API key literal in the Odoo cross-repo contract test"
  paths = [
      '''^tests/unit/test_odoo_cross_repo_contract\.py$''',
  ]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws"]

[[rules]]
id = "slack-bot-token"
description = "Slack Bot Token"
regex = '''xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{20,}'''
tags = ["slack"]

[[rules]]
id = "postgres-connection-string"
description = "PostgreSQL Connection String with Password"
regex = '''postgres(?:ql)?://[^:]+:[^@]+@[^/]+/[^\s'"]+'''
tags = ["database", "postgres"]

  # A URL whose host is the literal text `host:port` is a format template in
  # documentation, not a reachable database. This is the single finding the
  # former `*.md` path allowlist was hiding (CONFIG_ENV_CONTRACT.md on branch
  # feat/enrich-gap-fixes-docs-pack; workflows scan every fetched ref).
  [rules.allowlist]
  description = "Connection-string format template with the literal host `host:port`"
  regexTarget = "match"
  regexes = [
      '''^postgres(?:ql)?://[^:]+:[^@]+@host:port/''',
  ]

[[rules]]
id = "redis-connection-string"
description = "Redis Connection String with Password"
regex = '''redis://:[^@]+@[^/]+'''
tags = ["database", "redis"]

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key"]

[[rules]]
id = "jwt-token"
description = "JWT Token"
regex = '''eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'''
tags = ["jwt"]

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = '''SG\.[a-zA-Z0-9_-]{22}\.[a-zA-Z0-9_-]{43}'''
tags = ["api", "sendgrid"]

# ── Allowlist ─────────────────────────────────────────────────────────────
#
# There is no global allowlist. No whole-directory or whole-extension path is
# exempt, and no word in a match exempts it: the former global regex
# `(?i)example|placeholder|dummy|test|fake|mock|sample` suppressed every
# finding, under every rule, whose match contained one of those substrings
# (a real key containing "test" included). It hid nine historical findings,
# each now an exact fingerprint in .gitleaksignore with its reason. A new false
# positive gets the same treatment: an exact fingerprint in .gitleaksignore, or
# an exact file or a pattern that cannot match a real credential under the
# rule that fires, with a one-line reason.
# Contract: tests/ci/test_gitleaks_config_contract.py
