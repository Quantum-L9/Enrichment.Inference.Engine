# DIAGNOSTIC signing profile (class D): applied after compose.gate_loop.yml when
# GL_SIGNING=hmac. It exists because all-ed25519 node egress is blocked at SDK
# bc1c74c (findings F-A1-04, F-A7-02). It exercises the durability, feedback and
# match cases on main. A case run under this profile is never PASS for a signed
# claim; the ledger records the profile.
services:
  gate:
    environment:
      L9_SIGNING_ALGORITHM: hmac-sha256
      L9_SIGNING_KEY: ${GL_HMAC_GATE:?}
      L9_VERIFYING_KEYS_JSON: ${GL_HMAC_GATE_VERIFYING_KEYS_JSON:?}
      L9_KEY_ALLOWED_ACTIONS_JSON: >-
        {"odoo-gl": {"node": "odoo", "kind": "consumer", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["converge", "enrich", "match", "outcomes", "resolve", "score",
                                 "enrichment-sweep", "enrichment-sweep-results"]},
         "op-gl":   {"node": "operator", "kind": "consumer", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["health-assess", "score", "match"]},
         "eie-gl":  {"node": "enrichment-engine", "kind": "worker", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["sync", "health-assess", "score", "match"]},
         "ceg-gl":  {"node": "graph", "kind": "worker", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["graph-inference-result", "health-assess", "score"]}}
  enrichment-engine:
    environment:
      L9_SIGNING_ALGORITHM: hmac-sha256
      L9_SIGNING_KEY: ${GL_HMAC_EIE:?}
      L9_SIGNING_PRIVATE_KEY: ""
      L9_VERIFYING_KEYS_JSON: ${GL_HMAC_WORKER_VERIFYING_KEYS_JSON:?}
  graph:
    environment:
      L9_SIGNING_ALGORITHM: hmac-sha256
      L9_SIGNING_KEY: ${GL_HMAC_CEG:?}
      L9_SIGNING_PRIVATE_KEY: ""
      L9_VERIFYING_KEYS_JSON: ${GL_HMAC_WORKER_VERIFYING_KEYS_JSON:?}
