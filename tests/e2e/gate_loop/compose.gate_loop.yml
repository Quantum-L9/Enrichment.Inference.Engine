# gate_loop rail — EIE's overlay for the EIE-CEG-GATE-COLLAB-2026-11-21 proof
# (lane PROOF), applied ON TOP of Constellation.Gate's Docker rail:
#
#   docker compose -f <gate>/tests/e2e/docker/compose.yml -f compose.gate_loop.yml
#
# This overlay keeps that rail's topology. EIE and CEG share no network, so a
# direct peer call is impossible by construction. It changes four things:
#   1. every identity signs ed25519; no HMAC key exists in this run;
#   2. Gate carries an explicit caller policy per key, with distinct consumer
#      (odoo-gl), operator (op-gl) and worker (eie-gl, ceg-gl) identities;
#      the base rail signs its driver with Gate's own key;
#   3. CEG loads the TEST_ONLY tenant packs
#      (Cognitive.Engine.Graphs tests/fixtures/test_only_packs) and nothing else;
#   4. EIE loads plasticos (domains/, unmodified) plus the TEST_ONLY synthneutral
#      cartridge, from a directory run_gate_loop.sh assembles outside the repo.
# Keys come from scripts/gen_keys.py (ephemeral, outside the repo, mode 0600).

services:
  gate:
    environment:
      L9_ENVIRONMENT: staging
      L9_SIGNING_ALGORITHM: ed25519
      L9_SIGNING_KEY: ${GL_PRIV_GATE:?}
      L9_SIGNING_KEY_ID: gate-gl
      L9_VERIFYING_KEYS_JSON: ${GL_GATE_VERIFYING_KEYS_JSON:?}
      GATE_ADMIN_TOKEN: ${GL_ADMIN_TOKEN:?}
      # One policy per verifying key (staging requires it). Gate's own key id is
      # not a caller and has no entry (D-4 repaired in Gate 2384923). Worker lists include
      # the operator actions on purpose: refusing them must come from the
      # kind rule (ingress_validator.py:211-220), not from a missing list entry.
      L9_KEY_ALLOWED_ACTIONS_JSON: >-
        {"odoo-gl": {"node": "odoo", "kind": "consumer", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["converge", "enrich", "match", "outcomes", "resolve", "score",
                                 "enrichment-sweep", "enrichment-sweep-results"]},
         "op-gl":   {"node": "operator", "kind": "consumer", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["health-assess", "score", "match"]},
         "eie-gl":  {"node": "enrichment-engine", "kind": "worker", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["sync", "health-assess", "score", "match"]},
         "ceg-gl":  {"node": "graph", "kind": "worker", "tenants": ["plasticos", "synthneutral"],
                     "actions": ["graph-inference-result", "health-assess", "score"]}}

  enrichment-engine:
    environment:
      # Declared deviation (as in compose.converge.yml): the deterministic
      # provider is refused outside local/dev/test. `test` turns SDK dev_mode
      # on; GATE-KEY-01 key-id binding (L9_GATE_SIGNING_KEY_IDS) is what still
      # refuses a packet that is not Gate's. Recorded as F-A1-12.
      L9_ENVIRONMENT: test
      L9_ENRICHMENT_PROVIDER: deterministic
      L9_GATE_SIGNING_KEY_IDS: gate-gl
      GATE_ADMIN_TOKEN: ${GL_ADMIN_TOKEN:?}
      L9_SIGNING_ALGORITHM: ed25519
      L9_SIGNING_KEY: ""
      L9_SIGNING_PRIVATE_KEY: ${GL_PRIV_EIE:?}
      L9_SIGNING_KEY_ID: eie-gl
      L9_VERIFYING_KEYS_JSON: ${GL_WORKER_VERIFYING_KEYS_JSON:?}
      DOMAINS_DIR: /gl/eie_domains
      # EIE's database connection string comes from the base rail, with the
      # credential generated by scripts/gen_keys.py; it is not restated here.
    volumes:
      - ${GL_EIE_DOMAINS:?}:/gl/eie_domains:ro
    depends_on:
      eie-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]

  graph:
    environment:
      GATE_ADMIN_TOKEN: ${GL_ADMIN_TOKEN:?}
      L9_SIGNING_ALGORITHM: ed25519
      L9_SIGNING_KEY: ""
      L9_SIGNING_PRIVATE_KEY: ${GL_PRIV_CEG:?}
      L9_SIGNING_KEY_ID: ${GL_CEG_KEY_ID:-ceg-gl}
      L9_VERIFYING_KEYS_JSON: ${GL_WORKER_VERIFYING_KEYS_JSON:?}
      L9_GATE_SIGNING_KEY_IDS: gate-gl
      DOMAINS_ROOT: /gl/ceg_packs
      TENANT_ALLOWLIST: plasticos,synthneutral
      # Opt-in for the feedback seam under test; default False in settings.py.
      GRAPH_INFERENCE_FEEDBACK_ENABLED: ${GL_CEG_FEEDBACK:-true}
      FEEDBACK_ENABLED: ${GL_CEG_OUTCOME_FEEDBACK:-false}
    volumes:
      - ${GL_CEG_PACKS:?}:/gl/ceg_packs:ro

  # Credentials for neo4j, eie-postgres and the DSNs come from the base rail's
  # L9E2E_* variables, which scripts/rail.sh aliases to this run's GL_* values.
  eie-postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrich -d enrich"]
      interval: 3s
      timeout: 3s
      retries: 30
