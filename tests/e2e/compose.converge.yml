# Odoo `converge` e2e — EIE's overlay on Constellation.Gate's Docker rail, applied
# ON TOP of it (docker compose -f <gate>/tests/e2e/docker/compose.yml -f this).
# It narrows the rail to client -> gate -> enrichment-engine (+ eie-redis and
# eie-postgres). Gate stays staging with mandatory signatures and a replay guard.

services:
  gate:
    environment:
      # Exactly the two identities this proof has: the EIE worker (eie-e2e) and the
      # one admitted consumer (odoo-e2e). EIE's own keyring is NOT widened: it only
      # ever verifies Gate.
      L9_VERIFYING_KEYS_JSON: ${L9E2E_GATE_VERIFYING_KEYS_JSON:?gate keyring (eie-e2e + odoo-e2e) required}
      # Staging Gate needs a caller policy for every key it verifies. The consumer may claim
      # `odoo`, act for `plasticos`, and invoke the one action Odoo calls on EIE;
      # EIE's worker key keeps its own post-converge egress actions.
      L9_KEY_ALLOWED_ACTIONS_JSON: >-
        {"odoo-e2e": {"node": "odoo", "kind": "consumer", "tenants": ["plasticos"], "actions": ["converge"]},
         "eie-e2e": {"node": "enrichment-engine", "kind": "worker", "tenants": ["plasticos"], "actions": ["sync"]}}

  enrichment-engine:
    environment:
      # The in-repo deterministic source (app/services/deterministic_provider.py)
      # is refused outside local/dev/test, so EIE — and only EIE — runs `test`.
      L9_ENVIRONMENT: test
      L9_ENRICHMENT_PROVIDER: deterministic
      # GATE-KEY-01 (app/middleware/gate_ingress.py): `test` turns SDK dev_mode
      # on, which accepts unsigned packets. Binding /v1/execute to Gate's key id
      # is what still refuses a packet that claims Gate but was not signed by it.
      L9_GATE_SIGNING_KEY_IDS: gate-e2e
    depends_on:
      # The image entrypoint runs `alembic upgrade head` (migrations/, unmodified)
      # before serving; it needs Postgres accepting connections, not just started.
      eie-postgres: { condition: service_healthy }

  # Test fixture only: ephemeral, no published port, schema from EIE's migrations.
  eie-postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrich -d enrich"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Not part of this proof; started only with `--profile ceg`.
  graph: { profiles: [ceg] }
  neo4j: { profiles: [ceg] }
